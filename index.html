<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>问答知识库</title>
    <meta name="theme-color" content="#1a5bbf">
    <!-- PWA：手机可「添加到主屏幕」，装完像 App，断网也能打开 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="问答本">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
            padding: 28px 30px 40px;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #0b1f3b;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        h1 i {
            color: #2a7de1;
            font-size: 28px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px 12px;
            margin: 18px 0 22px;
            border-bottom: 1px solid #e6edf4;
            padding-bottom: 18px;
        }
        .left-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: white;
            border: 1px solid #d0ddee;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 14px;
            color: #1f3a5f;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            background: #f9fcff;
        }
        .btn i {
            font-size: 15px;
            color: #3a6a9e;
        }
        .btn-primary {
            background: #1a5bbf;
            border-color: #1a5bbf;
            color: white;
        }
        .btn-primary i {
            color: white;
        }
        .btn-primary:hover {
            background: #124a9e;
            border-color: #124a9e;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #d0ddee;
        }
        .btn-outline:hover {
            background: #eaf0fa;
            border-color: #b0c6e0;
        }
        .btn-danger {
            color: #b13e3e;
            border-color: #f5d6d6;
        }
        .btn-danger i {
            color: #b13e3e;
        }
        .btn-danger:hover {
            background: #ffe9e9;
            border-color: #dba8a8;
        }
        .btn-success {
            background: #2b8c5e;
            border-color: #2b8c5e;
            color: white;
        }
        .btn-success i {
            color: white;
        }
        .btn-success:hover {
            background: #1f6e4a;
            border-color: #1f6e4a;
        }

        .last-saved {
            font-size: 13px;
            color: #4b6a8a;
            background: #eef4fa;
            padding: 5px 16px;
            border-radius: 40px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== 搜索框 ===== */
        .search-box {
            display: flex;
            align-items: center;
            background: #f0f6fe;
            border-radius: 60px;
            padding: 4px 8px 4px 18px;
            border: 1px solid #d0ddee;
            transition: 0.2s;
            flex: 1 1 200px;
            min-width: 130px;
        }
        .search-box:focus-within {
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.12);
        }
        .search-box i,
        .search-box .search-ic {
            color: #4a709b;
            font-size: 14px;
        }
        .search-box .search-ic {
            width: 15px;
            height: 15px;
            flex: none;
        }
        /* 图标已全部改成内联 SVG（离线也可见），统一防止被 flex 压缩 */
        .btn svg,
        .search-box svg {
            flex: none;
        }
        .search-box input {
            border: none;
            background: transparent;
            padding: 8px 6px;
            font-size: 14px;
            outline: none;
            flex: 1;
            min-width: 60px;
            color: #1a2a3a;
        }
        .search-box input::placeholder {
            color: #aab8c9;
        }
        .search-clear {
            background: none;
            border: none;
            color: #b0c0d0;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            display: none;
        }
        .search-clear.visible {
            display: block;
        }
        .search-clear:hover {
            color: #2a7de1;
        }
        .highlight {
            background: #f9e66b;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: 600;
        }

        /* ===== 分类标签 ===== */
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 6px;
            margin: 6px 0 20px;
            border-bottom: 1px solid #e1eaf1;
            padding-bottom: 8px;
            align-items: center;
        }
        .category-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: #f0f5fd;
            border-radius: 40px;
            padding: 2px 2px 2px 18px;
            border: 1px solid transparent;
            transition: 0.15s;
        }
        .category-wrapper.active {
            background: #1a5bbf;
            border-color: #1a5bbf;
            box-shadow: 0 4px 8px rgba(26, 91, 191, 0.15);
        }
        .category-wrapper.active .category-tab {
            color: white;
        }
        .category-wrapper.active .category-tab .badge {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .category-wrapper.active .cat-edit-btn {
            color: rgba(255, 255, 255, 0.7);
        }
        .category-wrapper.active .cat-edit-btn:hover {
            color: white;
        }
        .category-wrapper.active .cat-del-btn {
            color: rgba(255, 255, 255, 0.7);
        }
        .category-wrapper.active .cat-del-btn:hover {
            color: #ffcccc;
        }

        .category-tab {
            background: transparent;
            border: none;
            padding: 5px 0;
            font-size: 14px;
            font-weight: 500;
            color: #1a3b5e;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.15s;
        }
        .category-tab .badge {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 30px;
            padding: 0px 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .cat-edit-btn,
        .cat-del-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 30px;
            color: #7a94b0;
            transition: 0.15s;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .cat-edit-btn:hover {
            background: rgba(0, 0, 0, 0.06);
            color: #2a7de1;
        }
        .cat-del-btn:hover {
            background: rgba(255, 0, 0, 0.08);
            color: #d14a4a;
        }

        .add-category-btn {
            background: transparent;
            border: 1px dashed #b8cde0;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 13px;
            color: #2a5d8f;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
            height: 34px;
        }
        .add-category-btn:hover {
            background: #e6f0fe;
            border-color: #7fa1cc;
        }

        /* ===== 重要性标签 ===== */
        .importance-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 4px;
            margin: 0 0 16px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid #ecf2f9;
        }
        .imp-tab {
            border: 1px solid #dae5f0;
            padding: 4px 16px 4px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            background: white;
            color: #2a4b73;
        }
        .imp-tab i,
        .imp-tab svg {
            font-size: 13px;
            flex: none;
        }
        .imp-tab .badge {
            background: rgba(0, 0, 0, 0.06);
            border-radius: 30px;
            padding: 0px 8px;
            font-size: 11px;
            font-weight: 600;
            color: inherit;
        }
        .imp-tab[data-imp="important"] {
            background: #fee9e6;
            border-color: #f5cdc7;
            color: #a1423a;
        }
        .imp-tab[data-imp="important"].active {
            background: #fdd3cd;
            border-color: #d18d83;
            color: #7a2e26;
            box-shadow: 0 0 0 2px rgba(209, 141, 131, 0.3);
        }
        .imp-tab[data-imp="important"] .badge {
            background: rgba(161, 66, 58, 0.12);
        }
        .imp-tab[data-imp="normal"] {
            background: #e6f0fa;
            border-color: #c5d8ed;
            color: #1f5582;
        }
        .imp-tab[data-imp="normal"].active {
            background: #c9ddf5;
            border-color: #88adcf;
            color: #0f3a5e;
            box-shadow: 0 0 0 2px rgba(136, 173, 207, 0.3);
        }
        .imp-tab[data-imp="normal"] .badge {
            background: rgba(31, 85, 130, 0.12);
        }
        .imp-tab[data-imp="favorite"] {
            background: #fef6e0;
            border-color: #f5e5b0;
            color: #a77b2b;
        }
        .imp-tab[data-imp="favorite"].active {
            background: #fceec2;
            border-color: #dbb45a;
            color: #7a571a;
            box-shadow: 0 0 0 2px rgba(219, 180, 90, 0.3);
        }
        .imp-tab[data-imp="favorite"] .badge {
            background: rgba(167, 123, 43, 0.12);
        }
        .imp-tab[data-imp="全部"] {
            background: #f5f9ff;
            border-color: #dae5f0;
            color: #1f3f62;
        }
        .imp-tab[data-imp="全部"].active {
            background: #1a5bbf;
            border-color: #1a5bbf;
            color: white;
        }
        .imp-tab[data-imp="全部"].active i,
        .imp-tab[data-imp="全部"].active svg {
            color: white;
        }
        .imp-tab[data-imp="全部"] .badge {
            background: rgba(0, 0, 0, 0.06);
        }

        /* ===== 问答卡片 ===== */
        .qa-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
            min-height: 180px;
        }
        .qa-item {
            background: white;
            border-radius: 20px;
            padding: 16px 20px 18px;
            border: 1px solid #e7eef7;
            box-shadow: 0 4px 8px -4px rgba(0, 20, 30, 0.06);
            transition: 0.15s;
        }
        .qa-item:hover {
            border-color: #cbddea;
        }

        /* ============================================================
           【批量选择】复选框 + 批量操作条
           ============================================================ */
        .qa-item.qa-selected {
            border-color: #2a7de1;
            background: #f4f9ff;
            box-shadow: 0 4px 10px -4px rgba(42, 125, 225, 0.28);
        }
        .qa-select {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            margin-top: 2px;
            cursor: pointer;
            flex: none;
        }
        .qa-select input {
            width: 17px;
            height: 17px;
            cursor: pointer;
            accent-color: #1a5bbf;
            flex: none;
        }

        .batch-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
            background: #eef5ff;
            border: 1px solid #cfdef0;
            border-radius: 14px;
            padding: 10px 14px;
            margin: 8px 0 12px;
        }
        .batch-bar .batch-checkall {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #1f3a5f;
            user-select: none;
        }
        .batch-bar .batch-checkall input {
            width: 17px;
            height: 17px;
            cursor: pointer;
            accent-color: #1a5bbf;
        }
        .batch-count {
            font-size: 13px;
            color: #3b5d7e;
        }
        .batch-count b {
            color: #1a5bbf;
            font-size: 15px;
        }
        .batch-bar .bb-sep {
            width: 1px;
            height: 20px;
            background: #cfdef0;
            margin: 0 2px;
        }
        .batch-bar select {
            border: 1px solid #d4e0ee;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 13px;
            background: white;
            color: #1f3a5f;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }
        .batch-bar select:focus {
            border-color: #2a7de1;
        }
        .batch-bar .btn {
            padding: 6px 14px;
            font-size: 13px;
        }
        /* 注意：这里不能再写 background:white —— 会盖掉 .btn-primary 的蓝底，
           导致「改分类」变成白底白字完全看不见 */
        .batch-bar .btn-outline {
            background: white;
            color: #1f3a5f;
        }
        .batch-bar .btn-danger {
            background: white;
            color: #b13e3e;
            border-color: #f0c9c9;
        }
        .batch-bar .btn-danger:hover {
            background: #ffe9e9;
            border-color: #dba8a8;
            color: #932f2f;
        }
        /* 注：.hidden 是全局 display:none !important，撤销按钮直接复用即可 */

        /* ===== 云同步面板 ===== */
        .sync-panel {
            background: #f4f9ff;
            border: 1px solid #cfdef0;
            border-radius: 14px;
            padding: 12px 14px;
            margin: 8px 0 12px;
        }
        .sync-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
        }
        .sync-row + .sync-row {
            margin-top: 8px;
        }
        .sync-label {
            font-size: 13px;
            color: #3b5d7e;
            flex: none;
        }
        .sync-panel select {
            border: 1px solid #d4e0ee;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 13px;
            background: white;
            color: #1f3a5f;
            cursor: pointer;
            outline: none;
            font-family: inherit;
            max-width: 100%;
        }
        .sync-input {
            border: 1px solid #d4e0ee;
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            background: white;
            color: #1f3a5f;
            outline: none;
            font-family: inherit;
            min-width: 180px;
            flex: 1 1 220px;
            max-width: 100%;
        }
        .sync-input:focus {
            border-color: #2a7de1;
        }
        .sync-input-sm {
            flex: 0 1 160px;
            min-width: 120px;
        }
        .sync-check {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #3b5d7e;
            cursor: pointer;
            user-select: none;
        }
        .sync-check input {
            width: 16px;
            height: 16px;
            accent-color: #1a5bbf;
            cursor: pointer;
        }
        .sync-panel .btn {
            padding: 6px 14px;
            font-size: 13px;
        }
        .sync-status {
            font-size: 13px;
            color: #3b5d7e;
            margin-left: auto;
            max-width: 100%;
        }
        .sync-note {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.7;
            color: #6b86a3;
        }
        .sync-note b {
            color: #3b5d7e;
        }
        @media (max-width: 700px) {
            .sync-status { margin-left: 0; }
        }
        .batch-tip {
            font-size: 12px;
            color: #7a94b0;
            margin-left: auto;
        }
        @media (max-width: 700px) {
            .batch-tip {
                display: none;
            }
        }
        .qa-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }
        .qa-question {
            font-weight: 600;
            font-size: 17px;
            color: #0d2847;
            flex: 1 1 200px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .qa-question .q-icon {
            font-size: 18px;
            color: #2a7de1;
        }
        .qa-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            font-size: 13px;
            color: #3b5d7e;
        }
        .qa-meta .time {
            background: #f0f6fe;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #1f4b78;
        }
        .qa-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            margin-left: 4px;
        }
        /* 图标 + 中文短标签：不依赖任何图标字体，断网/暗黑都看得见 */
        .qa-actions button {
            background: transparent;
            border: 1px solid transparent;
            height: 30px;
            padding: 0 11px 0 9px;
            border-radius: 40px;
            font-size: 12.5px;
            font-family: inherit;
            color: #2a5d8f;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .qa-actions button svg {
            width: 14px;
            height: 14px;
            flex: none;
        }
        .qa-actions button:hover {
            background: #e2edfc;
            border-color: #c5d8ed;
            color: #0a3c74;
        }
        .qa-actions .del-btn {
            color: #a1423a;
        }
        .qa-actions .del-btn:hover {
            background: #fee8e8;
            border-color: #f5cdc7;
            color: #8d3229;
        }

        /* ===== 回答内容（富文本显示） ===== */
        .qa-answer {
            margin: 8px 0 10px 36px;
            padding-left: 18px;
            border-left: 3px solid #cfdef0;
            color: #1d3857;
            font-size: 15px;
            line-height: 1.8;
            word-break: break-word;
        }
        .qa-answer .answer-label {
            font-weight: 500;
            color: #3f6b97;
            margin-right: 8px;
            font-size: 13px;
        }
        .qa-answer .answer-content {
            display: inline;
        }
        .qa-answer .answer-content p {
            margin-bottom: 8px;
        }
        .qa-answer .answer-content ul,
        .qa-answer .answer-content ol {
            padding-left: 24px;
            margin-bottom: 8px;
        }
        .qa-answer .answer-content blockquote {
            border-left: 4px solid #2a7de1;
            padding-left: 16px;
            color: #4a6a8a;
            margin: 8px 0;
        }

        /* ===== 富文本编辑区 ===== */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 10px;
            background: #f6faff;
            border-radius: 12px 12px 0 0;
            border: 1px solid #d4e0ee;
            border-bottom: none;
            align-items: center;
        }
        .editor-toolbar button {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 14px;
            color: #3a5a7a;
            transition: 0.15s;
            min-width: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }
        .editor-toolbar button:hover {
            background: #e8f0fe;
            border-color: #c5d8ed;
        }
        .editor-toolbar button.active {
            background: #d4e0ee;
            border-color: #a0b8d0;
        }
        /* 图标一律内联 SVG，断网也能看见 */
        .editor-toolbar button svg {
            width: 15px;
            height: 15px;
            flex: none;
            fill: currentColor;
        }
        .editor-toolbar button svg [stroke] {
            stroke: currentColor;
        }
        .editor-toolbar .btn-label {
            font-size: 12px;
            line-height: 1;
        }
        .editor-toolbar button[data-act="image"] {
            color: #1a5bbf;
            font-weight: 600;
        }
        .editor-toolbar select {
            border: 1px solid #d4e0ee;
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 13px;
            background: white;
            outline: none;
            max-width: 120px;
            cursor: pointer;
            color: #3a5a7a;
        }
        .editor-toolbar select.qa-font-size {
            max-width: 72px;
        }
        .editor-toolbar input[type="color"] {
            width: 28px;
            height: 28px;
            border: 1px solid #d4e0ee;
            border-radius: 6px;
            padding: 2px;
            cursor: pointer;
            background: white;
        }
        .editor-toolbar .separator {
            width: 1px;
            background: #d4e0ee;
            margin: 0 4px;
            align-self: stretch;
        }

        .qa-answer-editor {
            width: 100%;
            min-height: 120px;
            padding: 12px 14px;
            border: 1px solid #d4e0ee;
            border-radius: 0 0 12px 12px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.8;
            outline: none;
            background: white;
            overflow-y: auto;
            /* 自由拖拽画布：图片绝对定位以此容器为原点 */
            position: relative;
        }
        .qa-answer-editor:focus {
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.1);
        }
        .qa-answer-editor p {
            margin-bottom: 8px;
        }
        .qa-answer-editor ul,
        .qa-answer-editor ol {
            padding-left: 24px;
            margin-bottom: 8px;
        }
        .qa-answer-editor blockquote {
            border-left: 4px solid #2a7de1;
            padding-left: 16px;
            color: #4a6a8a;
            margin: 8px 0;
        }

        .qa-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 12px;
            border-top: 1px solid #eef4fa;
            padding-top: 12px;
        }
        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .badge-icon {
            border-radius: 40px;
            padding: 4px 12px 4px 10px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.1s;
            background: white;
            color: #2a4b73;
        }
        .badge-icon i {
            font-size: 14px;
        }
        .badge-icon.active {
            font-weight: 500;
        }
        .badge-icon.important {
            background: #fee9e6;
            border-color: #f5cdc7;
            color: #a1423a;
        }
        .badge-icon.important.active {
            background: #fdd3cd;
            border-color: #d18d83;
        }
        .badge-icon.normal {
            background: #e6f0fa;
            border-color: #c5d8ed;
            color: #1f5582;
        }
        .badge-icon.normal.active {
            background: #c9ddf5;
            border-color: #88adcf;
        }
        .badge-icon.favorite {
            background: #fef6e0;
            border-color: #f5e5b0;
            color: #a77b2b;
        }
        .badge-icon.favorite.active {
            background: #fceec2;
            border-color: #dbb45a;
        }

        .qa-category-select {
            border: 1px solid #d4e0ee;
            border-radius: 40px;
            padding: 4px 12px 4px 16px;
            font-size: 13px;
            background: white;
            color: #1f3a5f;
            cursor: pointer;
            outline: none;
            transition: 0.15s;
        }
        .qa-category-select:hover {
            border-color: #2a7de1;
        }
        .qa-category-select:focus {
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.08);
        }

        .empty-message {
            text-align: center;
            color: #6e8bb0;
            padding: 60px 20px;
            font-size: 16px;
            background: #f6faff;
            border-radius: 60px;
            border: 1px dashed #c5d8ed;
        }
        .hidden {
            display: none !important;
        }

        /* ===== 新增问答行 ===== */
        .add-qa-row {
            background: #f6fbff;
            border-radius: 24px;
            padding: 16px 20px;
            margin: 16px 0 8px;
            border: 1px solid #dbe6f2;
        }
        .add-qa-row .field-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        .add-qa-row .field-group input,
        .add-qa-row .field-group select {
            border: 1px solid #d4e0ee;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 14px;
            background: white;
            flex: 1 1 180px;
            font-family: inherit;
            outline: none;
        }
        .add-qa-row .field-group input:focus,
        .add-qa-row .field-group select:focus {
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.12);
        }
        .add-qa-row .editor-wrapper {
            margin-bottom: 12px;
        }
        .add-qa-row .editor-wrapper .qa-answer-editor {
            border-radius: 0 0 12px 12px;
            min-height: 100px;
        }
        .add-qa-row .btn-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* ============================================================
           图标策略（v3 起）：全部改成内联 SVG，不再依赖 Font Awesome CDN
           —— 装成 App 后断网也能正常显示，也不会再出现「图标是空白方块」。
           原先的 body.icons-missing emoji 兜底已随之删除。
           ============================================================ */

        /* ============================================================
           【新增】图片支持：插入 / 自由缩放 / 删除 / 多图 / 拖拽换位
           ============================================================ */
        .qa-answer-editor img,
        .answer-content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #e3ecf6;
        }
        .answer-content img {
            cursor: zoom-in;
            transition: box-shadow 0.15s, transform 0.15s;
        }
        .answer-content img:hover {
            box-shadow: 0 6px 18px -6px rgba(20, 50, 90, 0.4);
        }
        /* 编辑态：图片可拖动换位 */
        .qa-answer-editor img.qa-img {
            cursor: grab;
        }
        .qa-answer-editor img.qa-img:active {
            cursor: grabbing;
        }
        .qa-answer-editor img.img-dragging {
            opacity: 0.4;
            outline: 2px dashed #2a7de1;
            outline-offset: 2px;
        }
        .qa-answer-editor img.img-selected {
            outline: 2px solid #2a7de1;
            outline-offset: 2px;
            box-shadow: 0 6px 18px -8px rgba(42, 125, 225, 0.6);
        }
        .qa-answer-editor img.img-loading {
            opacity: 0.45;
        }

        /* ============================================================
           【自由漫游模式】图片脱离文档流，可拖到画布任意坐标
           坐标以 left/top 写入 style，随 HTML 一起保存
           ============================================================ */
        .qa-answer-editor img.qa-img-free,
        .answer-content img.qa-img-free {
            position: absolute;
            float: none;
            display: block;
            margin: 0;
            cursor: move;
            z-index: 1;
        }
        /* 拖动中：跟手 + 轻微抬升阴影 */
        .qa-answer-editor img.qa-img-free.img-free-moving {
            opacity: 0.9;
            outline: 2px dashed #2a7de1;
            outline-offset: 2px;
            box-shadow: 0 14px 30px -8px rgba(15, 45, 90, 0.45);
            transition: none;
        }
        /* 被选中的自由图片提到最上层，方便继续操作 */
        .qa-answer-editor img.qa-img-free.img-selected {
            z-index: 5;
        }
        /* 阅读态：只有含自由图片时才切成定位容器，普通回答排版不受影响 */
        .answer-content.free-layer {
            display: block;
            position: relative;
        }

        /* —— 图片排版模式（选中图片后在悬浮工具条切换）—— */
        .qa-answer-editor img.qa-img.qa-img-float-left,
        .answer-content img.qa-img.qa-img-float-left {
            float: left;
            margin: 6px 16px 8px 0;
        }
        .qa-answer-editor img.qa-img.qa-img-float-right,
        .answer-content img.qa-img.qa-img-float-right {
            float: right;
            margin: 6px 0 8px 16px;
        }
        .qa-answer-editor img.qa-img.qa-img-block-center,
        .answer-content img.qa-img.qa-img-block-center {
            float: none;
            display: block;
            margin: 10px auto;
        }
        .qa-answer-editor img.qa-img.qa-img-block-left,
        .answer-content img.qa-img.qa-img-block-left {
            float: none;
            display: block;
            margin: 10px auto 10px 0;
        }

        /* 浮动图片后必须清浮动，否则后续内容会塌上去 */
        .qa-answer::after,
        .qa-answer-editor::after {
            content: '';
            display: block;
            clear: both;
            height: 0;
            visibility: hidden;
        }

        /* 拖拽换位时的蓝色插入指示线 */
        .img-drop-indicator {
            position: absolute;
            z-index: 9997;
            height: 3px;
            background: #2a7de1;
            border-radius: 2px;
            pointer-events: none;
            box-shadow: 0 0 0 2px rgba(42, 125, 225, 0.18);
        }
        .img-drop-indicator::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -3px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #2a7de1;
        }

        /* 图片选中浮层（缩放手柄 + 工具条） */
        .img-resize-box {
            position: absolute;
            z-index: 9998;
            pointer-events: none;
        }
        .img-resize-handle {
            position: absolute;
            width: 13px;
            height: 13px;
            background: #fff;
            border: 2px solid #2a7de1;
            border-radius: 50%;
            pointer-events: auto;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        }
        .img-resize-handle.nw { left: -7px;  top: -7px;    cursor: nwse-resize; }
        .img-resize-handle.ne { right: -7px; top: -7px;    cursor: nesw-resize; }
        .img-resize-handle.sw { left: -7px;  bottom: -7px; cursor: nesw-resize; }
        .img-resize-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }

        .img-toolbar {
            position: absolute;
            left: 0;
            top: -44px;
            height: 36px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #14488f;
            color: #fff;
            border-radius: 8px;
            padding: 0 8px;
            pointer-events: auto;
            box-shadow: 0 6px 16px -6px rgba(0, 20, 50, 0.6);
            white-space: nowrap;
            font-size: 12px;
        }
        .img-toolbar .img-size-label {
            min-width: 74px;
            text-align: center;
            opacity: 0.95;
            font-variant-numeric: tabular-nums;
        }
        .img-toolbar input[type="range"] {
            width: 96px;
            accent-color: #7fb2f0;
            cursor: pointer;
        }
        .img-toolbar .img-tb-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.12s;
        }
        .img-toolbar .img-tb-btn:hover {
            background: rgba(255, 255, 255, 0.26);
        }
        .img-toolbar .img-tb-btn.active {
            background: rgba(255, 255, 255, 0.42);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }
        .img-toolbar .img-tb-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        .img-toolbar .img-tb-del {
            background: #b13e3e;
        }
        .img-toolbar .img-tb-del:hover {
            background: #d14a4a;
        }
        .img-toolbar .img-tb-sep {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.28);
            margin: 0 2px;
            flex: none;
        }
        /* 自由模式开启：绿色高亮 */
        .img-toolbar .img-tb-free.active {
            background: #2b8c5e;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }
        .img-toolbar .img-tb-free.active:hover {
            background: #35a371;
        }

        /* 大图预览 */
        .img-lightbox {
            position: fixed;
            left: 0; top: 0; right: 0; bottom: 0;
            background: rgba(8, 20, 36, 0.88);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 24px;
            cursor: zoom-out;
        }
        .img-lightbox.visible {
            display: flex;
        }
        .img-lightbox img {
            max-width: 94vw;
            max-height: 88vh;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }
        .img-lightbox .lb-tip {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-top: 14px;
        }
        .img-lightbox .lb-close {
            position: absolute;
            top: 18px;
            right: 22px;
            background: rgba(255, 255, 255, 0.14);
            border: none;
            color: #fff;
            font-size: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }
        .img-lightbox .lb-close:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        @media (max-width: 700px) {
            .app-container {
                padding: 20px 16px;
            }
            .qa-answer {
                margin-left: 0;
                padding-left: 12px;
            }
            .search-box {
                flex: 1 1 100%;
                margin-top: 6px;
            }
            .category-wrapper {
                padding: 2px 2px 2px 12px;
            }
            .category-tab {
                font-size: 13px;
            }
            .editor-toolbar {
                gap: 2px;
            }
            .editor-toolbar button {
                padding: 3px 6px;
                font-size: 13px;
            }
            .img-toolbar input[type="range"] {
                width: 60px;
            }
        }

        /* ============================================================
           【新增】问题标题行内编辑
           ============================================================ */
        .q-edit-box {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            flex: 1 1 240px;
        }
        .q-edit-input {
            flex: 1 1 180px;
            min-width: 140px;
            border: 1px solid #d4e0ee;
            border-radius: 40px;
            padding: 7px 16px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 600;
            color: #0d2847;
            background: white;
            outline: none;
        }
        .q-edit-input:focus {
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.12);
        }
        .q-edit-box .btn {
            padding: 5px 14px;
            font-size: 13px;
        }

        /* ============================================================
           【新增】分页
           ============================================================ */
        .pagination {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 10px;
            margin: 20px 0 4px;
            padding-top: 4px;
        }
        .pager-btn {
            min-width: 36px;
            height: 34px;
            padding: 0 12px;
            border: 1px solid #d0ddee;
            background: #f9fcff;
            color: #1f3a5f;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            font-family: inherit;
        }
        .pager-btn:hover:not(:disabled):not(.active) {
            background: #eaf0fa;
            border-color: #b0c6e0;
        }
        .pager-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pager-btn.active {
            background: #1a5bbf;
            border-color: #1a5bbf;
            color: #fff;
        }
        .pager-info {
            font-size: 13px;
            color: #4b6a8a;
            white-space: nowrap;
        }
        .pager-info b {
            color: #1a5bbf;
        }
        .page-size-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4b6a8a;
        }
        .page-size-wrap select {
            border: 1px solid #d0ddee;
            background: #f9fcff;
            color: #1f3a5f;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }
        .page-size-wrap select:focus {
            border-color: #2a7de1;
        }
        .pager-dots {
            color: #8aa4c0;
            padding: 0 2px;
        }

        /* —— 原本写死在 style 属性里的颜色，搬到 class 上，暗黑模式才能覆盖 —— */
        .new-cat-select {
            border-radius: 40px;
            padding: 10px 18px;
            border: 1px solid #d4e0ee;
            background: white;
            font-size: 14px;
            color: #1f3a5f;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }
        .new-cat-select:focus {
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.12);
        }
        .qa-cat-tag {
            color: #22558a;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
        }
        .empty-answer {
            color: #9aa8b8;
        }
        /* 图标换成内联 SVG 后的对齐 / 尺寸补齐 */
        .qa-question .q-icon {
            display: inline-flex;
            align-items: center;
        }

        .cat-edit-btn svg,

        }

        /* ============================================================
           【新增】暗黑主题
           做法：html[data-theme="dark"] + 原选择器 = 特异性更高，直接覆盖
           ============================================================ */
        html[data-theme="dark"] {

        html[data-theme="dark"] .app-container {

            color: #a9c0d8;
        }

        html[data-theme="dark"] .btn {

            border-color: #34455a;
            color: #d6e2f0;
        }
        html[data-theme="dark"] .btn i {

        }
        html[data-theme="dark"] .btn:hover {
            background: #2a3746;
            border-color: #46586f;
        }

            border-color: #2a6fd6;

        }
        html[data-theme="dark"] .btn-primary i {

        }
        html[data-theme="dark"] .btn-primary:hover {
            background: #1e5cbb;
            border-color: #1e5cbb;
        }
        html[data-theme="dark"] .btn-outline {
            background: #222d3a;
        }
        html[data-theme="dark"] .btn-danger {
            color: #ff9d9d;
            border-color: #5c3232;
        }
        html[data-theme="dark"] .btn-danger:hover {
            background: #3a2222;
        }
        html[data-theme="dark"] .btn-success {
            background: #2b8c5e;
            border-color: #2b8c5e;
            color: #fff;
        }

        /* —— 搜索 —— */
        html[data-theme="dark"] .search-box {
            background: #222d3a;
            border-color: #34455a;
        }
        html[data-theme="dark"] .search-box input {
            color: #dfe9f5;
        }
        html[data-theme="dark"] .search-box i,
        html[data-theme="dark"] .search-box .search-ic,
        html[data-theme="dark"] .search-clear {
            color: #8aa4c0;
        }

        /* —— 分类 / 重要性标签 —— */
        html[data-theme="dark"] .category-tabs,
        html[data-theme="dark"] .importance-tabs {
            border-bottom-color: #2b3947;
        }
        html[data-theme="dark"] .category-wrapper {
            background: #22303f;
        }
        html[data-theme="dark"] .category-tab {
            color: #c2d2e4;
        }
        html[data-theme="dark"] .category-wrapper.active {
            background: #2a6fd6;
            border-color: #2a6fd6;
        }
        html[data-theme="dark"] .cat-edit-btn,
        html[data-theme="dark"] .cat-del-btn {
            color: #8aa4c0;
        }
        html[data-theme="dark"] .add-category-btn {
            border-color: #46586f;
            color: #9dbde0;
        }
        html[data-theme="dark"] .add-category-btn:hover {
            background: #2a3746;
            border-color: #5c74a3;
        }
        html[data-theme="dark"] .imp-tab {
            background: #22303f;
            border-color: #34455a;
            color: #c2d2e4;
        }
        html[data-theme="dark"] .imp-tab[data-imp="important"] {
            background: #452a28;
            border-color: #6b3a35;
            color: #f0a99f;
        }
        html[data-theme="dark"] .imp-tab[data-imp="important"].active {
            background: #6b3a35;
            border-color: #93504a;
            color: #ffd9d2;
        }
        html[data-theme="dark"] .imp-tab[data-imp="normal"] {
            background: #22374f;
            border-color: #35516f;
            color: #a5c8ea;
        }
        html[data-theme="dark"] .imp-tab[data-imp="normal"].active {
            background: #2f5a80;
            border-color: #4a6d94;
            color: #d3e6fa;
        }
        html[data-theme="dark"] .imp-tab[data-imp="favorite"] {
            background: #453b22;
            border-color: #6b5a35;

        }

        /* —— 问答卡片 —— */
        html[data-theme="dark"] .qa-item {
            background: #1f2833;
            border-color: #2c3947;
            box-shadow: 0 4px 8px -4px rgba(0, 0, 0, 0.5);
        }

        }
        html[data-theme="dark"] .qa-actions button:hover {

        }
        html[data-theme="dark"] .qa-actions .del-btn:hover {

        }
        html[data-theme="dark"] .qa-answer {

        }
        html[data-theme="dark"] .qa-answer .answer-label {

        }
        html[data-theme="dark"] .qa-answer .answer-content {
            color: #cfdcea;
        }
        html[data-theme="dark"] .qa-answer .answer-content blockquote {
            color: #9db2c9;
            border-left-color: #2a6fd6;
        }
        html[data-theme="dark"] .qa-footer {
            border-top-color: #2b3947;
        }
        html[data-theme="dark"] .badge-icon {
            background: #22303f;
            border-color: #34455a;
            color: #c2d2e4;
        }
        html[data-theme="dark"] .badge-icon.important {
            background: #452a28;
            border-color: #6b3a35;
            color: #f0a99f;
        }
        html[data-theme="dark"] .badge-icon.normal {
            background: #22374f;
            border-color: #35516f;
            color: #a5c8ea;
        }
        html[data-theme="dark"] .badge-icon.favorite {
            background: #453b22;
            border-color: #6b5a35;
            color: #f0d59f;
        }
        html[data-theme="dark"] .qa-category-select,
        html[data-theme="dark"] .batch-bar select,
        html[data-theme="dark"] .editor-toolbar select,
        html[data-theme="dark"] .q-edit-input,
        html[data-theme="dark"] .add-qa-row .field-group input,
        html[data-theme="dark"] .add-qa-row .field-group select,
        html[data-theme="dark"] .page-size-wrap select {
            background: #222d3a;
            border-color: #34455a;
            color: #dfe9f5;
        }
        html[data-theme="dark"] .highlight {
            background: #8a6d16;
            color: #fff6d8;
        }
        html[data-theme="dark"] .empty-message {
            background: #1b232d;
            border-color: #34455a;
            color: #8aa4c0;
        }

        /* —— 编辑器 —— */
        html[data-theme="dark"] .editor-toolbar {
            background: #22303f;
            border-color: #34455a;
        }
        html[data-theme="dark"] .editor-toolbar button {
            color: #c2d2e4;
        }
        html[data-theme="dark"] .editor-toolbar button:hover {
            background: #2a3746;
            border-color: #46586f;
        }
        html[data-theme="dark"] .editor-toolbar button.active {
            background: #34455a;
            border-color: #5c74a3;
        }
        html[data-theme="dark"] .editor-toolbar .separator {
            background: #34455a;
        }
        html[data-theme="dark"] .qa-answer-editor {
            background: #1b232d;
            border-color: #34455a;
            color: #dfe9f5;
        }
        html[data-theme="dark"] .qa-answer-editor blockquote {
            color: #9db2c9;
        }
        html[data-theme="dark"] .add-qa-row {
            background: #1b232d;
            border-color: #2c3947;
        }
        html[data-theme="dark"] .editor-hint {
            color: #6f8aa6;
        }

        /* —— 批量条 / 分页 —— */
        html[data-theme="dark"] .batch-bar {
            background: #22303f;
            border-color: #34455a;
        }
        html[data-theme="dark"] .batch-bar .batch-checkall {
            color: #d6e2f0;
        }
        html[data-theme="dark"] .batch-count {
            color: #9db2c9;
        }
        html[data-theme="dark"] .batch-count b {
            color: #6ea6f0;
        }
        html[data-theme="dark"] .batch-bar .btn-outline {
            background: #222d3a;
            color: #d6e2f0;
        }
        html[data-theme="dark"] .batch-bar .btn-danger {
            background: #3a2222;
            color: #ff9d9d;
            border-color: #6b3a3a;
        }
        html[data-theme="dark"] .batch-bar .btn-danger:hover {
            background: #4a2828;
            color: #ffc0c0;
            border-color: #8a4a4a;
        }
        html[data-theme="dark"] .batch-bar .bb-sep {
            background: #34455a;
        }

        /* —— 云同步面板 —— */
        html[data-theme="dark"] .sync-panel {
            background: #1b2532;
            border-color: #34455a;
        }
        html[data-theme="dark"] .sync-panel select,
        html[data-theme="dark"] .sync-input {
            background: #222d3a;
            border-color: #3d5169;
            color: #dfe9f5;
        }
        html[data-theme="dark"] .sync-panel select option {
            background: #222d3a;
            color: #e6edf3;
        }
        html[data-theme="dark"] .sync-input::placeholder {
            color: #6f8aa6;
        }
        html[data-theme="dark"] .sync-label,
        html[data-theme="dark"] .sync-check,
        html[data-theme="dark"] .sync-status {
            color: #9db2c9;
        }
        html[data-theme="dark"] .sync-note {
            color: #6f8aa6;
        }
        html[data-theme="dark"] .sync-note b {
            color: #9db2c9;
        }
        html[data-theme="dark"] .sync-panel .btn-danger {
            background: #3a2222;
            color: #ff9d9d;
            border-color: #6b3a3a;
        }
        html[data-theme="dark"] .sync-panel .btn-danger:hover {
            background: #4a2828;
            color: #ffc0c0;
        }
        html[data-theme="dark"] .batch-tip {
            color: #6f8aa6;
        }
        html[data-theme="dark"] .pager-btn {
            background: #222d3a;
            border-color: #34455a;
            color: #c2d2e4;
        }
        html[data-theme="dark"] .pager-btn:hover:not(:disabled):not(.active) {
            background: #2a3746;
            border-color: #46586f;
        }
        html[data-theme="dark"] .pager-btn.active {
            background: #2a6fd6;
            border-color: #2a6fd6;
            color: #fff;
        }
        html[data-theme="dark"] .pager-info,
        html[data-theme="dark"] .page-size-wrap {
            color: #9db2c9;
        }
        html[data-theme="dark"] .pager-info b {
            color: #6ea6f0;
        }

        /* —— 图片浮层 —— */
        html[data-theme="dark"] .img-toolbar {
            background: #2a3746;
            border-color: #46586f;
            color: #dfe9f5;
        }
        html[data-theme="dark"] .img-toolbar .img-size-label {
            color: #c2d2e4;
        }
        html[data-theme="dark"] .img-toolbar .img-tb-btn:hover {
            background: #34455a;
        }
        html[data-theme="dark"] .img-resize-handle {
            background: #6ea6f0;
            border-color: #fff;
        }
        html[data-theme="dark"] .img-drop-indicator,
        html[data-theme="dark"] .img-drop-indicator::before {
            background: #6ea6f0;
        }
        html[data-theme="dark"] .img-lightbox {
            background: rgba(0, 0, 0, 0.88);
        }

        /* —— 下拉的 <option>：UA 默认白底，不覆盖就是「白底 + 亮字」= 看不见 —— */
        html[data-theme="dark"] select option,
        html[data-theme="dark"] option {
            background: #222d3a;
            color: #dfe9f5;
        }
        html[data-theme="dark"] .new-cat-select {
            background: #222d3a;
            border-color: #34455a;
            color: #dfe9f5;
        }
        html[data-theme="dark"] .qa-cat-tag {
            color: #8fb4dc;
        }
        html[data-theme="dark"] .empty-answer {
            color: #6f8aa6;
        }
        html[data-theme="dark"] .qa-actions button {
            border-color: transparent;
        }
        html[data-theme="dark"] .qa-actions button:hover {
            border-color: #46586f;
        }
        html[data-theme="dark"] .qa-actions .del-btn {
            color: #f0a99f;
        }
        html[data-theme="dark"] .qa-actions .del-btn:hover {
            background: #432727;
            border-color: #6b3a35;
        }

        /* ============================================================
           「装成 App」引导条（手机 / 可安装的浏览器才出现）
           ============================================================ */
        /* 引导条是浮在页面上的，显示时给 body 留出底部空间，免得压住最后一张卡片 */
        body.install-hint-on {
            padding-bottom: 120px;
        }
        @media (max-width: 560px) {
            body.install-hint-on {
                padding-bottom: 165px;
            }
        }
        .install-bar {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 950;
            width: min(700px, calc(100% - 32px));
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px 11px 14px;
            background: #ffffff;
            border: 1px solid #cfe0f4;
            border-radius: 15px;
            box-shadow: 0 12px 32px rgba(18, 46, 84, 0.18);
            color: #1f3a5f;
            font-size: 13px;
        }
        /* 注：全局 .hidden 是 display:none !important，能盖住上面的 display:flex */

        .install-bar .ib-main {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .install-bar .ib-ic {
            display: flex;
            flex: none;
            color: #1a5bbf;
        }
        .install-bar .ib-txt {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }
        .install-bar .ib-txt strong {
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.35;
        }
        .install-bar .ib-txt span {
            color: #5a7290;
            font-size: 12px;
            line-height: 1.55;
        }
        .install-bar .ib-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: none;
        }
        .install-bar .btn {
            padding: 7px 14px;
            font-size: 13px;
        }
        .install-bar .ib-close {
            background: none;
            border: none;
            color: #8ba0b8;
            font-size: 20px;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.15s;
        }
        .install-bar .ib-close:hover {
            color: #1a5bbf;
            background: #eef4fc;
        }

        html[data-theme="dark"] .install-bar {
            background: #1b2430;
            border-color: #33455c;
            color: #dbe6f2;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }
        html[data-theme="dark"] .install-bar .ib-ic {
            color: #8fb4dc;
        }
        html[data-theme="dark"] .install-bar .ib-txt span {
            color: #93a8bf;
        }
        html[data-theme="dark"] .install-bar .ib-close {
            color: #7d92aa;
        }
        html[data-theme="dark"] .install-bar .ib-close:hover {
            color: #8fb4dc;
            background: #26323f;
        }

        /* 小屏：改成上下两行，文字不再被挤成一条 */
        @media (max-width: 560px) {
            .install-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                bottom: 10px;
                width: calc(100% - 20px);
            }
            .install-bar .ib-actions {
                justify-content: flex-end;
            }
            .install-bar .ib-actions .btn {
                flex: 1;
            }
        }

        /* ============================================================
           手机端排版兜底：窄屏上「图左文右 / 图右文左」会把文字挤成一条细缝，
           改成独占一行居中；自由定位的图片也保证不超出容器宽度。
           ============================================================ */
        @media (max-width: 700px) {
            .qa-answer-editor img.qa-img.qa-img-float-left,
            .answer-content img.qa-img.qa-img-float-left,
            .qa-answer-editor img.qa-img.qa-img-float-right,
            .answer-content img.qa-img.qa-img-float-right {
                float: none;
                display: block;
                margin: 10px auto;
                max-width: 100%;
            }
            .qa-answer-editor img.qa-img-free,
            .answer-content img.qa-img-free {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <header style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
            <h1><svg viewBox="0 0 16 16" aria-hidden="true" style="width:26px;height:26px;vertical-align:-4px;color:#2a7de1;"><path d="M1.6 3.2h12.8v7.6H7.2L3.2 14.2v-3.4H1.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M4.6 6.2h6.8M4.6 8.7h4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> 问答知识库</h1>
            <div class="last-saved" id="lastSavedDisplay"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:13px;height:13px;vertical-align:-2px;"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.35"/><path d="M8 4.4V8l2.4 1.5" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg> 最新编辑: <span id="lastSavedTime">--</span></div>
        </header>

        <div class="toolbar">
            <div class="left-actions">
                <button class="btn btn-primary" id="addQaBtn"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.35"/><path d="M8 4.9v6.2M4.9 8h6.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> 新增问答</button>
                <button class="btn btn-outline" id="exportWordBtn"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;"><path d="M2.2 2.6h7.4L13.8 7v6.4H2.2z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M9.6 2.6V7h4.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M4.4 8.6l1 3.4 1.2-2.4 1.2 2.4 1-3.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg> 导出Word</button>
                <button class="btn btn-outline" id="exportCacheBtn"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;"><path d="M8 1.8v8.4M4.9 7.1L8 10.2l3.1-3.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.2 11.4v2.8h11.6v-2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> 导出缓存</button>
                <button class="btn btn-outline" id="importCacheBtn"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;"><path d="M8 10.4V2M4.9 5.1L8 2l3.1 3.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.2 11.4v2.8h11.6v-2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> 导入缓存</button>
                <button class="btn btn-outline" id="clearAllBtn"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;"><path d="M2.6 4.6h10.8M6 4.6V2.9h4v1.7M4.1 4.6l.8 8.5h6.2l.8-8.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> 清空全部</button>
                <button class="btn btn-outline" id="batchSelectBtn" title="进入批量选择模式：可勾选多条，统一改分类或导出">
                    <svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;"><rect x="1.5" y="2.4" width="13" height="11.2" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.4 8.2l2.3 2.3 4.9-5.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    批量选择
                </button>
                <button class="btn btn-outline" id="themeToggleBtn" title="切换明亮 / 暗黑主题">
                    <svg id="themeIcon" viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;">
                        <path id="themeIconPath" d="M13.2 9.8A5.6 5.6 0 0 1 6.2 2.8a5.8 5.8 0 1 0 7 7z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
                    </svg>
                    <span id="themeLabel">暗黑</span>
                </button>
                <button class="btn btn-outline" id="syncBtn" title="云同步：把问答同步到云端，手机和电脑共用同一份数据">
                    <svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;"><path d="M4.6 11.6a2.9 2.9 0 0 1-.3-5.8 4.1 4.1 0 0 1 7.8-.8 3.2 3.2 0 0 1-.4 6.4H4.6z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M8 7.2v4.6M6.1 10.3L8 12.2l1.9-1.9" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    云同步
                </button>
                <div class="search-box">
                    <svg viewBox="0 0 16 16" aria-hidden="true" class="search-ic"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4l3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                    <input type="text" id="searchInput" placeholder="搜索问答..." />
                    <button class="search-clear" id="searchClear" title="清空搜索"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.35"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg></button>
                </div>
            </div>
        </div>

        <!-- ===== 云同步面板（点「云同步」展开） ===== -->
        <div class="sync-panel hidden" id="syncPanel">
            <div class="sync-row">
                <span class="sync-label">后端</span>
                <select id="syncBackendSel" title="选一个存放同步数据的地方">
                    <option value="gist">GitHub Gist（推荐，和你的 Pages 同一账号）</option>
                    <option value="custom">自定义接口（jsonbin / 自建 API 等）</option>
                </select>
                <label class="sync-check"><input type="checkbox" id="syncAutoChk"> 自动同步（打开页面自动拉取，改完自动上传）</label>
            </div>

            <div class="sync-row" id="rowGist">
                <span class="sync-label">令牌</span>
                <input type="password" class="sync-input" id="syncToken" placeholder="粘贴个人访问令牌（只需勾选 gist 读写权限）" />
                <span class="sync-label">Gist ID</span>
                <input type="text" class="sync-input" id="syncGistId" placeholder="留空则首次上传时自动新建（secret）" />
            </div>

            <div class="sync-row hidden" id="rowCustom">
                <span class="sync-label">下载 URL</span>
                <input type="text" class="sync-input" id="syncGetUrl" placeholder="https://…（GET 返回同步 JSON）" />
                <span class="sync-label">上传 URL</span>
                <input type="text" class="sync-input" id="syncPutUrl" placeholder="https://…（PUT/POST 接收同步 JSON）" />
                <span class="sync-label">请求头</span>
                <input type="text" class="sync-input sync-input-sm" id="syncHeaderName" placeholder="X-Master-Key" />
                <input type="password" class="sync-input sync-input-sm" id="syncHeaderValue" placeholder="值（可留空）" />
            </div>

            <div class="sync-row">
                <button class="btn btn-primary" id="syncSaveCfgBtn">保存设置</button>
                <button class="btn btn-outline" id="syncPushBtn">
                    <svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;"><path d="M8 12.4V3.6M4.8 6.8L8 3.6l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.8 13.2h10.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
                    上传到云端
                </button>
                <button class="btn btn-outline" id="syncPullBtn">
                    <svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;"><path d="M8 3.6v8.8M4.8 9.2L8 12.4l3.2-3.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.8 2.8h10.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
                    从云端拉取
                </button>
                <button class="btn btn-outline" id="syncTestBtn">测试连接</button>
                <button class="btn btn-danger" id="syncClearCfgBtn">清空配置</button>
                <span class="sync-status" id="syncStatus">未配置</span>

    <script>
        (function() {

            // ============================================================

            // DOM 引用

            // —— 批量选择相关 DOM ——
            const batchSelectBtn = document.getElementById('batchSelectBtn');
            const batchBar = document.getElementById('batchBar');
            const batchCheckAll = document.getElementById('batchCheckAll');
            const batchCheckAllLabel = document.getElementById('batchCheckAllLabel');
            const batchCount = document.getElementById('batchCount');
            const batchCategorySelect = document.getElementById('batchCategorySelect');
            const batchApplyCatBtn = document.getElementById('batchApplyCatBtn');
            const batchExportBtn = document.getElementById('batchExportBtn');
            const batchDeleteBtn = document.getElementById('batchDeleteBtn');
            const batchUndoBtn = document.getElementById('batchUndoBtn');
