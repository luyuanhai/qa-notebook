                    if (!allCats.includes(item.category)) {
                        const opt = document.createElement('option');
                        opt.value = item.category;
                        opt.textContent = item.category;
                        opt.selected = true;
                        catSelect.appendChild(opt);
                    }
                    catSelect.addEventListener('change', function() {
                        moveQaToCategory(item.id, this.value);
                    });

                    const catWrapper = document.createElement('span');
                    catWrapper.style.display = 'inline-flex';
                    catWrapper.style.alignItems = 'center';
                    catWrapper.style.gap = '4px';
                    catWrapper.innerHTML = `<span class="qa-cat-tag">${ICON.tag}</span>`;
                    catWrapper.appendChild(catSelect);

                    footer.appendChild(badgeGroup);
                    footer.appendChild(catWrapper);

                    div.appendChild(header);
                    div.appendChild(ansDiv);
                    div.appendChild(footer);

                    const delBtn = div.querySelector('.del-btn');
                    delBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (confirm(`确定删除问答：“${item.question}” ？`)) {
                            qaData = qaData.filter(q => q.id !== item.id);
                            markDeleted(item.id);            // 记删除标记，云同步时不会被拉回来
                            selectedIds.delete(item.id);   // 同步清掉勾选，避免残留幽灵 id
                            refreshCategories();
                            if (!categories.includes(currentCategory) && currentCategory !== '全部')
                                currentCategory = '全部';
                            lastEditTime = new Date();
                            updateLastSaved();
                            renderTabs();
                            renderQaList();
                            renderImportanceTabs();
                            populateCategorySelect();
                            saveData();
                        }
                    });

                    // —— 【新增】问题标题行内编辑 ——
                    const startQuestionEdit = function() {
                        if (qDiv.querySelector('.q-edit-box')) return;   // 已在编辑中
                        const oldHtml = qDiv.innerHTML;

                        qDiv.innerHTML = '';
                        const box = document.createElement('div');
                        box.className = 'q-edit-box';
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'q-edit-input';
                        input.value = item.question;
                        input.placeholder = '问题标题';
                        const okBtn = document.createElement('button');
                        okBtn.className = 'btn btn-primary';
                        okBtn.innerHTML = ICON.check + ' 保存';
                        const cancelBtn = document.createElement('button');
                        cancelBtn.className = 'btn btn-outline';
                        cancelBtn.textContent = '取消';
                        box.appendChild(input);
                        box.appendChild(okBtn);
                        box.appendChild(cancelBtn);
                        qDiv.appendChild(box);
                        input.focus();
                        input.select();

                        const finish = function(save) {
                            if (save) {
                                const v = input.value.trim();
                                if (!v) { alert('问题标题不能为空'); input.focus(); return; }
                                if (v !== item.question) {
                                    item.question = v;
                                    item.time = formatTime(new Date());
                                    lastEditTime = new Date();
                                    updateLastSaved();
                                    saveData();
                                }
                                renderQaList();
                                renderTabs();
                            } else {
                                qDiv.innerHTML = oldHtml;
                                qDiv.addEventListener('dblclick', onQDbl);
                            }
                        };

                        okBtn.addEventListener('click', function(e) { e.stopPropagation(); finish(true); });
                        cancelBtn.addEventListener('click', function(e) { e.stopPropagation(); finish(false); });
                        input.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter') { e.preventDefault(); finish(true); }
                            else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
                        });
                    };

                    const onQDbl = function(e) {
                        e.stopPropagation();
                        startQuestionEdit();
                    };
                    qDiv.addEventListener('dblclick', onQDbl);

                    const qEditBtn = div.querySelector('.edit-q-btn');
                    if (qEditBtn) {
                        qEditBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            startQuestionEdit();
                        });
                    }

                    const editBtn = div.querySelector('.edit-btn');
                    editBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        clearImageUI();
                        const answerDiv = div.querySelector('.qa-answer');
                        const currentHtml = item.answer || '';
                        const oldContent = answerDiv.innerHTML;

                        const editorWrapper = document.createElement('div');
                        editorWrapper.style.width = '100%';

                        const toolbar = document.createElement('div');
                        toolbar.className = 'editor-toolbar';
                        buildToolbar(toolbar);
                        editorWrapper.appendChild(toolbar);

                        const editor = document.createElement('div');
                        editor.className = 'qa-answer-editor';
                        editor.contentEditable = true;
                        editor.innerHTML = currentHtml || '<p><br></p>';
                        editorWrapper.appendChild(editor);

                        const btnGroup = document.createElement('div');
                        btnGroup.style.cssText = 'margin-top:10px;display:flex;gap:10px;';
                        const saveEditBtn = document.createElement('button');
                        saveEditBtn.className = 'btn btn-primary';
                        saveEditBtn.innerHTML = ICON.check + ' 保存';
                        const cancelEditBtn = document.createElement('button');
                        cancelEditBtn.className = 'btn btn-outline';
                        cancelEditBtn.innerHTML = '取消';
                        btnGroup.appendChild(saveEditBtn);
                        btnGroup.appendChild(cancelEditBtn);
                        editorWrapper.appendChild(btnGroup);

                        answerDiv.innerHTML = '';
                        answerDiv.appendChild(editorWrapper);

                        // 统一挂载：文本命令 + 图片插入/缩放/删除
                        attachEditorFeatures(editor, toolbar);

                        // 已存在的自由定位图片：按**当前容器宽度**还原坐标（跨设备一致），
                        // 再撑开编辑区高度；图片解码完成才有真实高度，所以 load 后补算一次
                        applyFreeLayout(editor);
                        editor.querySelectorAll('img.qa-img-free').forEach(im => {
                            // 图片解码完才有真实宽度，老数据要等这时才能补算相对坐标
                            if (!im.complete) im.addEventListener('load', function() { applyFreeLayout(editor); });
                        });

                        setTimeout(() => editor.focus(), 50);

                        saveEditBtn.addEventListener('click', function() {
                            clearImageUI();
                            const newHtml = editor.innerHTML.trim();
                            if (!newHtml || newHtml === '<p><br></p>' || newHtml === '<br>') {
                                alert('回答内容不能为空');
                                return;
                            }
                            item.answer = newHtml;
                            item.time = formatTime(new Date());
                            lastEditTime = new Date();
                            updateLastSaved();
                            renderQaList();
                            renderTabs();
                            renderImportanceTabs();
                            saveData();
                        });

                        cancelEditBtn.addEventListener('click', function() {
                            clearImageUI();
                            answerDiv.innerHTML = oldContent;
                        });
                    });

                    fragment.appendChild(div);
                });
                container.innerHTML = '';
                container.appendChild(fragment);

                // 阅读态：先按当前容器宽度把相对坐标还原成像素（手机上才不会跑出屏幕），
                // 自由定位的图片不占高度，容器需要按最下方的图撑开
                // 图片解码完成才有真实高度，所以 load 之后再补算一次
                container.querySelectorAll('.answer-content.free-layer').forEach(layer => {
                    const imgs = layer.querySelectorAll('img.qa-img-free');
                    if (!imgs.length) return;
                    applyFreeLayout(layer);
                    imgs.forEach(im => {
                        if (!im.complete) {
                            im.addEventListener('load', function() { applyFreeLayout(layer); });
                        }
                    });
                });
                renderPagination(total, totalPages);
                updateBatchBar();
            }

            // ============================================================
            //  【新增】分页：每页条数 + 翻页
            // ============================================================
            function resetPage() {
                currentPage = 1;
            }

            /** @param {number} total 筛选后的总条数  @param {number} totalPages 总页数 */
            function renderPagination(total, totalPages) {
                if (!pagination) return;
                pagination.innerHTML = '';
                if (total === 0) { pagination.classList.add('hidden'); return; }

                // 只有一页时也要显示「每页 N 条」选择器，方便随时调整
                const needPager = total > pageSize;
                pagination.classList.remove('hidden');

                // —— 每页条数 ——
                const sizeWrap = document.createElement('span');
                sizeWrap.className = 'page-size-wrap';
                sizeWrap.innerHTML = '<span>每页</span>';
                const sel = document.createElement('select');
                sel.id = 'pageSizeSelect';
                sel.title = '每页显示的问答数量';
                [10, 20, 30].forEach(n => {
                    const o = document.createElement('option');
                    o.value = String(n);
                    o.textContent = String(n);
                    if (n === pageSize) o.selected = true;
                    sel.appendChild(o);
                });
                sel.addEventListener('change', function() {
                    pageSize = parseInt(this.value, 10) || 10;
                    currentPage = 1;                 // 换了每页条数，回到第一页
                    savePrefs();
                    renderQaList();
                });
                sizeWrap.appendChild(sel);
                sizeWrap.appendChild(document.createTextNode('条'));
                pagination.appendChild(sizeWrap);

                // —— 统计信息 ——
                const info = document.createElement('span');
                info.className = 'pager-info';
                const from = total === 0 ? 0 : (currentPage - 1) * pageSize + 1;
                const to = Math.min(currentPage * pageSize, total);
                info.innerHTML = `共 <b>${total}</b> 条 · ${from}-${to} · 第 <b>${currentPage}</b>/<b>${totalPages}</b> 页`;
                pagination.appendChild(info);

                if (!needPager) return;

                // —— 翻页按钮 ——
                const mk = (label, page, opt) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'pager-btn' + (opt && opt.active ? ' active' : '');
                    b.textContent = label;
                    if (opt && opt.disabled) b.disabled = true;
                    if (opt && opt.title) b.title = opt.title;
                    if (!b.disabled) {
                        b.addEventListener('click', function() {
                            currentPage = page;
                            renderQaList();
                            scrollToListTop();
                        });
                    }
                    return b;
                };

                pagination.appendChild(mk('«', 1, { disabled: currentPage === 1, title: '首页' }));
                pagination.appendChild(mk('‹ 上一页', currentPage - 1, { disabled: currentPage === 1 }));

                // 页码按钮：最多显示 5 个，中间用省略号
                const win = 5;
                let from2 = Math.max(1, currentPage - Math.floor(win / 2));
                let to2 = Math.min(totalPages, from2 + win - 1);
                from2 = Math.max(1, to2 - win + 1);
                if (from2 > 1) {
                    pagination.appendChild(mk('1', 1));
                    if (from2 > 2) {
                        const d = document.createElement('span');
                        d.className = 'pager-dots';
                        d.textContent = '…';
                        pagination.appendChild(d);
                    }
                }
                for (let p = from2; p <= to2; p++) {
                    pagination.appendChild(mk(String(p), p, { active: p === currentPage }));
                }
                if (to2 < totalPages) {
                    if (to2 < totalPages - 1) {
                        const d = document.createElement('span');
                        d.className = 'pager-dots';
                        d.textContent = '…';
                        pagination.appendChild(d);
                    }
                    pagination.appendChild(mk(String(totalPages), totalPages));
                }

                pagination.appendChild(mk('下一页 ›', currentPage + 1, { disabled: currentPage === totalPages }));
                pagination.appendChild(mk('»', totalPages, { disabled: currentPage === totalPages, title: '末页' }));
            }

            function scrollToListTop() {
                try {
                    const y = container.getBoundingClientRect().top + window.scrollY - 12;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                } catch (e) {
                    container.scrollIntoView({ block: 'start' });
                }
            }

            // ============================================================
            //  搜索功能
            // ============================================================
            searchInput.addEventListener('input', function() {
                searchKeyword = this.value;
                searchClear.classList.toggle('visible', searchKeyword.length > 0);
                resetPage();                     // 搜索词变了，回到第 1 页
                renderQaList();
            });

            searchClear.addEventListener('click', function() {
                searchInput.value = '';
                searchKeyword = '';
                searchClear.classList.remove('visible');
                resetPage();
                renderQaList();
            });

            // ============================================================
            //  新增问答
            // ============================================================
            function addNewQA() {
                const q = newQuestion.value.trim();
                const a = newAnswerEditor.innerHTML.trim();
                const cat = newCategorySelect.value || '默认';
                if (!q) { alert('问题不能为空'); return; }
                if (!a || a === '<p><br></p>' || a === '<br>') { alert('回答内容不能为空'); return; }

                const newItem = {
                    id: nextId++,
                    question: q,
                    answer: a,
                    category: cat,
                    importance: 'normal',
                    time: formatTime(new Date())
                };
                qaData.push(newItem);
                if (!categories.includes(cat)) categories.push(cat);
                currentCategory = cat;
                lastEditTime = new Date();
                updateLastSaved();
                clearImageUI();
                newQuestion.value = '';
                newAnswerEditor.innerHTML = '<p><br></p>';
                renderTabs();
                // 跳到新条目所在的那一页，避免"添加完看不见"
                const idx = getFilteredData().findIndex(i => i.id === newItem.id);
                currentPage = idx < 0 ? 1 : Math.floor(idx / pageSize) + 1;
                renderQaList();
                renderImportanceTabs();
                populateCategorySelect();
                addRow.classList.add('hidden');
                saveData();
            }

            function showAddRow() {
                addRow.classList.remove('hidden');
                newQuestion.focus();
                populateCategorySelect();
                newAnswerEditor.innerHTML = '<p><br></p>';
            }

            // ============================================================
            //  导出Word
            // ============================================================
            /**
             * 导出 Word
             * @param {Array<number>} [ids] 传入则只导出这些 id（批量导出），不传则导出全部
             */
            function exportWord(ids) {
                let list = qaData;
                if (ids && ids.length) {
                    const pick = new Set(ids);
                    list = qaData.filter(i => pick.has(i.id));
                }
                if (list.length === 0) {
                    alert(ids ? '没有可导出的问答，请先勾选' : '没有问答可以导出');
                    return;
                }
                let htmlContent =
                    `<html><head><meta charset="UTF-8"><title>问答导出</title><style>body{font-family:'Segoe UI',Arial,sans-serif;padding:30px;}.qa{margin-bottom:30px;border-bottom:1px solid #ddd;padding-bottom:20px;}.q{font-weight:bold;font-size:20px;margin-bottom:8px;}.a{margin:8px 0 6px 20px;line-height:1.8;}.a img{max-width:100%;height:auto;display:block;margin:10px 0;}.a img.qa-img-export{position:static !important;float:none !important;left:auto !important;top:auto !important;display:block;margin:10px auto;}.meta{color:#4a6a8a;font-size:14px;margin-top:6px;}.cat{background:#eef3f9;padding:2px 14px;border-radius:20px;}ul,ol{padding-left:24px;}blockquote{border-left:4px solid #2a7de1;padding-left:16px;color:#4a6a8a;}</style></head><body><h1>📋 问答知识库 导出</h1><p>导出时间: ${formatTime(new Date())}</p>`;
                list.forEach(item => {
                    // 自由定位图片在 Word 里会乱飞，导出时降级为顺序排列
                    const safeAnswer = (item.answer || '').replace(/qa-img-free/g, 'qa-img-export');
                    htmlContent +=
                        `<div class="qa"><div class="q">❓ ${escapeHtml(item.question)}</div><div class="a">💬 ${safeAnswer}</div><div class="meta">分类: <span class="cat">${escapeHtml(item.category)}</span>  ·  重要性: ${item.importance}  ·  更新: ${item.time}</div></div>`;
                });
                htmlContent += '</body></html>';
                const blob = new Blob([htmlContent], { type: 'application/msword' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                const scope = (ids && ids.length) ? `_选中${list.length}条` : '';
                link.download = `问答导出${scope}_${formatTime(new Date()).replace(/[: ]/g,'_')}.doc`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // ============================================================
            //  清空全部
            // ============================================================
            function clearAll() {
                if (qaData.length === 0) return;
                if (confirm('⚠️ 确定清空所有问答吗？')) {
                    markDeleted(qaData.map(i => i.id));   // 全部打上删除标记，同步后别的设备也会清掉
                    qaData = [];
                    selectedIds.clear();
                    clearUndoBuffer();   // 全清了，之前暂存的删除记录也一起作废
                    categories = ['全部', '默认'];
                    currentCategory = '全部';
                    currentImportance = '全部';
                    searchKeyword = '';
                    searchInput.value = '';
                    searchClear.classList.remove('visible');
                    resetPage();
                    lastEditTime = new Date();
                    updateLastSaved();
                    renderTabs();
                    renderQaList();
                    renderImportanceTabs();
                    populateCategorySelect();
                    saveData();
                }
            }

            // ============================================================
            //  导出缓存
            // ============================================================
            function exportCache() {
                if (qaData.length === 0) {
                    alert('当前没有数据可导出。');
                    return;
                }
                const cacheData = {
                    qaData: qaData,
                    categories: categories,
                    nextId: nextId,
                    lastEditTime: lastEditTime.toISOString(),
                    exportedAt: new Date().toISOString(),
                    version: '1.0'
                };
                const json = JSON.stringify(cacheData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                const fileName = `问答缓存_${formatTime(new Date()).replace(/[: ]/g,'_')}.json`;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            }

            // ============================================================
            //  导入缓存
            // ============================================================
            function importCache(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        // 基本验证
                        if (!data.qaData || !Array.isArray(data.qaData)) {
                            alert('❌ 无效的缓存文件：缺少 qaData 字段或格式错误。');
                            return;
                        }
                        if (!data.categories || !Array.isArray(data.categories)) {
                            alert('❌ 无效的缓存文件：缺少 categories 字段或格式错误。');
                            return;
                        }
                        if (typeof data.nextId !== 'number') {
                            alert('❌ 无效的缓存文件：nextId 字段缺失或类型错误。');
                            return;
                        }

                        // 检查是否包含必要字段
                        if (data.qaData.length > 0) {
                            const first = data.qaData[0];
                            if (!first.id || !first.question || !first.answer || !first.category || !first.importance) {
                                alert('⚠️ 缓存数据格式不完整，但将尝试导入（可能缺少某些字段）。');
                            }
                        }

                        // 确保 categories 包含 "全部" 和 "默认"
                        if (!data.categories.includes('全部')) data.categories.unshift('全部');
                        if (!data.categories.includes('默认')) data.categories.push('默认');

                        // 如果当前有数据，询问是否覆盖
                        if (qaData.length > 0) {
                            if (!confirm(`当前有 ${qaData.length} 条问答，确定用导入的 ${data.qaData.length} 条数据覆盖吗？`)) {
                                return;
                            }
                        }

                        // 替换数据（旧 id 可能不存在了，勾选状态一并清空）
                        qaData = data.qaData;
                        selectedIds.clear();
                        clearUndoBuffer();   // 数据整体被替换，旧的撤销记录作废
                        categories = data.categories;
                        nextId = data.nextId;
                        if (data.lastEditTime) {
                            lastEditTime = new Date(data.lastEditTime);
                        } else {
                            lastEditTime = new Date();
                        }

                        // 重置筛选状态
                        currentCategory = '全部';
                        currentImportance = '全部';
                        searchKeyword = '';
                        searchInput.value = '';
                        searchClear.classList.remove('visible');
                        resetPage();

                        // 保存并刷新
                        saveData();
                        updateLastSaved();
                        renderAll();
                        populateCategorySelect();
                        alert(`✅ 导入成功！共导入 ${qaData.length} 条问答。`);
                    } catch (err) {
                        alert('❌ 导入失败：文件解析错误，请确保是有效的 JSON 缓存文件。\n' + err.message);
                        console.error('导入错误:', err);
                    }
                };
                reader.onerror = function() {
                    alert('❌ 读取文件失败，请重试。');
                };
                reader.readAsText(file);
            }

            // ============================================================
            //  云同步（后端：GitHub Gist / 自定义接口）
            //  ⚠️ 令牌只存本机 localStorage，绝不写进源码（公开仓库会被看光）
            // ============================================================
            const SYNC_FILE = 'qa-sync.json';
            const SYNC_API = 'https://api.github.com/gists';
            let tombstones = {};        // { id: ISO时间 } 删除标记：防止云端把本地已删的条目又拉回来
            let syncCfg = { backend: 'gist', token: '', gistId: '', getUrl: '', putUrl: '',
                            headerName: '', headerValue: '', auto: false };
            let syncBusy = false;
            let autoPushTimer = null;
            let pendingPush = false;     // 有改动还没推上去
            let lastSyncAt = null;

            function setSyncStatus(text) { if (syncStatus) syncStatus.textContent = text; }

            /* ---------- 配置 / 删除标记的本机存取 ---------- */
            function loadSyncCfg() {
                try {
                    const raw = localStorage.getItem('qaSyncCfg');
                    if (raw) Object.assign(syncCfg, JSON.parse(raw));
                } catch (e) { console.warn('同步配置读取失败', e); }
            }
            function saveSyncCfg() {
                try { localStorage.setItem('qaSyncCfg', JSON.stringify(syncCfg)); }
                catch (e) { console.warn('同步配置保存失败', e); }
            }
            function loadTombstones() {
                try { tombstones = JSON.parse(localStorage.getItem('qaTombstones') || '{}'); }
                catch (e) { tombstones = {}; }
                if (!tombstones || typeof tombstones !== 'object') tombstones = {};
            }
            function saveTombstones() {
                try { localStorage.setItem('qaTombstones', JSON.stringify(tombstones)); } catch (e) { /* 忽略 */ }
            }
            function pruneTombstones() {
                const cut = Date.now() - 30 * 24 * 3600 * 1000;   // 只留 30 天
                Object.keys(tombstones).forEach(k => {
                    const t = new Date(tombstones[k]).getTime();
                    if (!t || t < cut) delete tombstones[k];
                });
            }
            function markDeleted(ids, when) {
                const t = (when || new Date()).toISOString();
                (Array.isArray(ids) ? ids : [ids]).forEach(id => { tombstones[String(id)] = t; });
                pruneTombstones();
                saveTombstones();
            }
            function unmarkDeleted(ids) {
                (Array.isArray(ids) ? ids : [ids]).forEach(id => { delete tombstones[String(id)]; });
                saveTombstones();
            }

            function syncConfigured() {
                return syncCfg.backend === 'gist'
                    ? (!!syncCfg.token && !!syncCfg.gistId)
                    : (!!syncCfg.getUrl && !!syncCfg.putUrl);
            }
            function syncPushable() {
                return syncCfg.backend === 'gist' ? !!syncCfg.token : !!syncCfg.putUrl;
            }

            /* ---------- 同步包 ---------- */
            function buildPayload() {
                return {
                    app: 'qa-kb', version: 1,
                    updatedAt: new Date().toISOString(),
                    categories: categories, nextId: nextId,
                    qaData: qaData, tombstones: tombstones
                };
            }

            function ghHeaders() {
                const h = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
                if (syncCfg.token) h['Authorization'] = 'Bearer ' + syncCfg.token;
                return h;
            }

            /* ---------- 上传 ---------- */
            async function remotePush(payload) {
                const body = JSON.stringify(payload);
                // keepalive：页面关掉/切后台时也能把这一发请求送出去（浏览器对 keepalive 有
                // 64KB 请求体上限，超了会直接失败，所以只在小包时启用，图片多的包照常走普通请求）
                const ka = body.length < 60000;
                if (syncCfg.backend === 'gist') {
                    const files = {}; files[SYNC_FILE] = { content: body };
                    const headers = ghHeaders();
                    headers['Content-Type'] = 'application/json';
                    let res;
                    if (syncCfg.gistId) {
                        res = await fetch(SYNC_API + '/' + encodeURIComponent(syncCfg.gistId), {
                            method: 'PATCH', headers: headers, keepalive: ka,
                            body: JSON.stringify({ files: files })
                        });
                    } else {
                        res = await fetch(SYNC_API, {
                            method: 'POST', headers: headers, keepalive: ka,
                            body: JSON.stringify({ description: '问答知识库 · 同步数据', public: false, files: files })
                        });
                    }
                    const text = await res.text();
                    if (!res.ok) throw new Error('GitHub 返回 ' + res.status + '：' + text.slice(0, 160));
                    const data = JSON.parse(text);
                    if (data && data.id && data.id !== syncCfg.gistId) {
                        syncCfg.gistId = data.id;          // 首次上传自动建号，回写表单
                        saveSyncCfg();
                        fillSyncForm();
                    }
                    return { id: data && data.id };
                }
                const h = { 'Content-Type': 'application/json' };
                if (syncCfg.headerName) h[syncCfg.headerName] = syncCfg.headerValue || '';
                const res = await fetch(syncCfg.putUrl, { method: 'PUT', headers: h, body: body, keepalive: ka });
                if (!res.ok) throw new Error('上传接口返回 ' + res.status);
                return {};
            }

            /* ---------- 拉取 ---------- */
            async function remotePull() {
                if (syncCfg.backend === 'gist') {
                    const metaRes = await fetch(SYNC_API + '/' + encodeURIComponent(syncCfg.gistId),
                                                { headers: ghHeaders(), cache: 'no-store' });
                    if (!metaRes.ok) throw new Error('读取 Gist 失败：HTTP ' + metaRes.status + '（令牌失效或 ID 不对）');
                    const meta = await metaRes.json();
                    const fs = meta.files || {};
                    const f = fs[SYNC_FILE] || Object.keys(fs).map(k => fs[k])[0];
                    if (!f) throw new Error('这个 Gist 里还没有同步文件，先点「上传到云端」');
                    // 走 raw_url 拿全文 —— 接口返回的 content 超过 1MB 会被截断
                    // 再加时间戳参数：raw.githubusercontent.com 有 CDN 缓存，
                    // 不加的话刚上传完立刻拉取，拿到的可能还是上一版（表现为"同步了没生效"）
                    const rawUrl = f.raw_url + (f.raw_url.indexOf('?') > -1 ? '&' : '?') + '_t=' + Date.now();
                    const rawRes = await fetch(rawUrl, { cache: 'no-store' });
                    if (!rawRes.ok) throw new Error('读取同步内容失败：HTTP ' + rawRes.status);
                    return { payload: JSON.parse(await rawRes.text()), updatedAt: meta.updated_at };
                }
                const h = {};
                if (syncCfg.headerName) h[syncCfg.headerName] = syncCfg.headerValue || '';
                const res = await fetch(syncCfg.getUrl, { headers: h, cache: 'no-store' });
                if (!res.ok) throw new Error('下载接口返回 HTTP ' + res.status);
                return { payload: JSON.parse(await res.text()), updatedAt: null };
            }

            /* ---------- 合并：按 id 合并，时间新的赢，已删的不复活 ---------- */
            function mergePayload(payload) {
                if (!payload || !Array.isArray(payload.qaData)) throw new Error('云端数据格式不对（缺少 qaData）');

                const rt = payload.tombstones || {};
                Object.keys(rt).forEach(k => {
                    if (!tombstones[k] || new Date(rt[k]) > new Date(tombstones[k])) tombstones[k] = rt[k];
                });

                const map = new Map();
                qaData.forEach(i => map.set(String(i.id), i));
                let added = 0, updated = 0, skipped = 0, removed = 0;

                // ---- ① 先应用删除标记：别的设备删掉的，本机也要跟着删 ----
                // 只按 tombstone 单向判定是不够的（云端 payload 里根本没这条，遍历不到），
                // 必须回头扫一遍本地数据，否则「只同步新增、不同步删除」。
                const doomed = [];                       // 存原始 id（可能是数字），便于清勾选
                qaData.forEach(i => {
                    const key = String(i.id);
                    const delAt = tombstones[key] ? new Date(tombstones[key]).getTime() : 0;
                    if (!delAt) return;
                    const editAt = new Date(String(i.time || '')).getTime() || 0;
                    // 删除之后又被改过（两边都算，留 60 秒时钟误差）→ 以最后修改为准，不删
                    if (editAt > delAt + 60000) return;
                    doomed.push(i.id);
                });
                if (doomed.length) {
                    const set = new Set(doomed.map(String));
                    qaData = qaData.filter(i => !set.has(String(i.id)));
                    doomed.forEach(id => { selectedIds.delete(id); selectedIds.delete(String(id)); });
                    removed = doomed.length;
                }

                // ---- ② 再合并云端条目 ----
                payload.qaData.forEach(ri => {
                    if (!ri || ri.id === undefined || ri.id === null) return;
                    const key = String(ri.id);
                    const delAt = tombstones[key] ? new Date(tombstones[key]).getTime() : 0;
                    const editAt = new Date(String(ri.time || '')).getTime() || 0;
                    if (delAt && delAt >= editAt - 60000) { skipped++; return; }   // 本地删得更晚 → 不复活
                    const local = map.get(key);
                    if (!local) { qaData.push(ri); map.set(key, ri); added++; return; }
                    const lt = new Date(String(local.time || '')).getTime() || 0;
                    if (editAt > lt) { Object.assign(local, ri); updated++; }
                });

                const cats = (Array.isArray(payload.categories) ? payload.categories : []).concat(categories);
                categories = ['全部'];
                cats.forEach(c => { if (c && c !== '全部' && categories.indexOf(c) === -1) categories.push(c); });
                if (categories.indexOf('默认') === -1) categories.push('默认');

                const rn = parseInt(payload.nextId, 10);
                if (!isNaN(rn) && rn > nextId) nextId = rn;
                qaData.forEach(i => { const n = parseInt(i.id, 10); if (!isNaN(n) && n >= nextId) nextId = n + 1; });

                if (removed) refreshCategories();
                pruneTombstones();
                saveTombstones();
                return { added: added, updated: updated, skipped: skipped, removed: removed };
            }

            /* ---------- 对外动作 ---------- */
            async function doSyncPull(silent) {
                if (syncBusy) { if (!silent) alert('同步进行中，稍等一下'); return; }
                if (!syncConfigured()) {
                    openSyncPanel();
                    if (!silent) alert('还没配好云同步。\n用 Gist 的话：填令牌 → 先点一次「上传到云端」→ 会自动生成 Gist ID。');
                    return;
                }
                syncBusy = true; setSyncStatus('正在拉取…');
                try {
                    const r = await remotePull();
                    const stat = mergePayload(r.payload);
                    // 别的设备删空的分类，本机正停在该分类上 → 退回「全部」，否则一片空白
                    if (currentCategory !== '全部' && categories.indexOf(currentCategory) === -1) {
                        currentCategory = '全部';
                    }
                    if (stat.removed) clearUndoBuffer();   // 撤销缓冲里可能存着已被云端删掉的条目
                    lastEditTime = new Date();
                    updateLastSaved();
                    renderAll();
                    saveData();
                    lastSyncAt = new Date();
                    const bits = [`新增 ${stat.added}`, `更新 ${stat.updated}`];
                    if (stat.removed) bits.push(`删除 ${stat.removed}`);
                    if (stat.skipped) bits.push(`忽略已删 ${stat.skipped}`);
                    setSyncStatus('已拉取 · ' + bits.join(' / ') + ' · ' + formatTime(lastSyncAt));
                    if (!silent) alert('✅ 已合并云端数据：' + bits.join('，') + '。');
                    if (syncCfg.auto) scheduleAutoPush();      // 拉完再推一次，两边收敛
                } catch (e) {
                    console.error('拉取失败', e);
                    setSyncStatus('拉取失败：' + e.message);
                    if (!silent) alert('❌ 拉取失败：' + e.message);
                } finally { syncBusy = false; }
            }

            async function doSyncPush(silent) {
                if (syncBusy) { if (!silent) alert('同步进行中，稍等一下'); return; }
                if (!syncPushable()) { openSyncPanel(); if (!silent) alert('先填好云同步设置'); return; }
                syncBusy = true; setSyncStatus('正在上传…');
                try {
                    // ⚠️ 上传是「整包覆盖」，不先合并对方的数据，就会把对方刚写进去的
                    //    删除标记冲掉（表现为：B 一上传，A 之前删掉的东西又活了）。
                    //    所以上传前先静默拉一次并合并 —— 即 read-modify-write。
                    let merged = null;
                    if (syncConfigured()) {
                        try {
                            merged = mergePayload((await remotePull()).payload);
                            if (currentCategory !== '全部' && categories.indexOf(currentCategory) === -1) {
                                currentCategory = '全部';
                            }
                            renderAll();
                            saveData(true);      // 安静保存：别再触发一次自动推送
                        } catch (e) {
                            console.warn('上传前预合并失败，改为直接上传本地数据', e);
                        }
                    }
                    const r = await remotePush(buildPayload());
                    lastSyncAt = new Date();
                    const extra = merged && (merged.added || merged.updated || merged.removed)
                        ? `（先合并了云端：新增${merged.added}/更新${merged.updated}/删除${merged.removed}）` : '';
                    setSyncStatus(`已上传 ${qaData.length} 条${extra ? ' ' + extra : ''} · ${formatTime(lastSyncAt)}`);
                    if (!silent) alert(`✅ 已上传 ${qaData.length} 条问答到云端。` +
                                       (r && r.id ? `\nGist ID：${r.id}（已自动填好，另一台设备填同一个 ID 即可）` : ''));
                } catch (e) {
                    console.error('上传失败', e);
                    setSyncStatus('上传失败：' + e.message);
                    if (!silent) alert('❌ 上传失败：' + e.message);
                } finally { syncBusy = false; }
            }

            function scheduleAutoPush() {
                if (!syncCfg.auto || !syncPushable()) return;
                pendingPush = true;              // 有改动等着推
                if (autoPushTimer) clearTimeout(autoPushTimer);
                autoPushTimer = setTimeout(function() { autoPushTimer = null; pendingPush = false; doSyncPush(true); }, 4000);
            }

            /** 立刻把待推的改动送出去（不等 4 秒）——切后台/关页面时用 */
            function flushAutoPush() {
                if (!pendingPush || !syncCfg.auto || !syncPushable()) return;
                if (autoPushTimer) { clearTimeout(autoPushTimer); autoPushTimer = null; }
                pendingPush = false;
                doSyncPush(true);
            }
            // 手机切后台时 setTimeout 会被冻结甚至丢弃，防抖那 4 秒可能永远等不到，
            // 所以在页面隐藏/卸载的瞬间抢发一次（配合 keepalive，关页面也能送出）
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') flushAutoPush();
            });
            window.addEventListener('pagehide', flushAutoPush);

            async function testSync() {
                setSyncStatus('测试中…');
                try {
                    if (syncCfg.backend === 'gist') {
                        if (!syncCfg.token) throw new Error('还没填 GitHub 令牌');
                        const res = await fetch(SYNC_API, { headers: ghHeaders() });
                        if (!res.ok) throw new Error('GitHub 返回 HTTP ' + res.status + '（令牌无效或没有 gist 权限）');
                        const list = await res.json();
                        setSyncStatus(`令牌可用，能看到 ${list.length} 个 Gist`);
                        alert('✅ 令牌可用。' + (syncCfg.gistId ? '已配好 Gist ID，可以直接上传 / 拉取。'
                                                                : '还没配 Gist ID —— 点「上传到云端」会自动新建一个。'));
                    } else {
                        if (!syncCfg.getUrl) throw new Error('还没填下载 URL');
                        const h = {};
                        if (syncCfg.headerName) h[syncCfg.headerName] = syncCfg.headerValue || '';
                        const res = await fetch(syncCfg.getUrl, { headers: h, cache: 'no-store' });
                        if (!res.ok) throw new Error('下载接口返回 HTTP ' + res.status);
                        const p = JSON.parse(await res.text());
                        setSyncStatus('接口可用，云端有 ' + ((p.qaData || []).length) + ' 条');
                        alert('✅ 接口可用，云端现有 ' + ((p.qaData || []).length) + ' 条问答。');
                    }
                } catch (e) {
                    setSyncStatus('测试失败：' + e.message);
                    alert('❌ 测试失败：' + e.message);
                }
            }

            /* ---------- 表单 ---------- */
            function fillSyncForm() {
                syncBackendSel.value = syncCfg.backend;
                syncAutoChk.checked = !!syncCfg.auto;
                syncToken.value = syncCfg.token || '';
                syncGistId.value = syncCfg.gistId || '';
                syncGetUrl.value = syncCfg.getUrl || '';
                syncPutUrl.value = syncCfg.putUrl || '';
                syncHeaderName.value = syncCfg.headerName || '';
                syncHeaderValue.value = syncCfg.headerValue || '';
                rowGist.classList.toggle('hidden', syncCfg.backend !== 'gist');
                rowCustom.classList.toggle('hidden', syncCfg.backend !== 'custom');
                setSyncStatus(syncConfigured()
                    ? '已配置' + (lastSyncAt ? ' · 上次同步 ' + formatTime(lastSyncAt) : '')
                    : '未配置');
            }
            function readSyncForm() {
                // 面板没展开时，表单里还是 HTML 的初始空值 —— 拿它覆盖会把已存的令牌/Gist ID 冲掉，
                // 表现就是「明明配好了，一上传就说没配置」。所以只有面板真正打开才认表单。
                if (syncPanel.classList.contains('hidden')) return;
                syncCfg.backend = syncBackendSel.value;
                syncCfg.auto = !!syncAutoChk.checked;
                syncCfg.token = syncToken.value.trim();
                syncCfg.gistId = syncGistId.value.trim();
                syncCfg.getUrl = syncGetUrl.value.trim();
                syncCfg.putUrl = syncPutUrl.value.trim();
                syncCfg.headerName = syncHeaderName.value.trim();
                syncCfg.headerValue = syncHeaderValue.value;
            }
            function openSyncPanel() {
                syncPanel.classList.remove('hidden');
                fillSyncForm();
            }

            // ============================================================
            //  渲染所有
            // ============================================================
            function renderAll() {
                clearImageUI();
                renderImportanceTabs();
                renderTabs();
                renderQaList();
                populateCategorySelect();
                populateBatchCategorySelect();

            }

            // ============================================================

            // ============================================================

            themeToggleBtn.addEventListener('click', toggleTheme);

            // ============================================================

                      (syncConfigured() ? '' : '\n\n当前还差：' +

            syncClearCfgBtn.addEventListener('click', function() {

            // 导出缓存

            // ============================================================

            } catch (e) { /* 老浏览器没有 URLSearchParams，忽略即可 */ }

            // 窗口缩放 / 手机横竖屏切换 → 自由图片按新的容器宽度重排（防抖，别抖一次算一次）
            let relayoutTimer = null;

                relayoutTimer = setTimeout(relayoutAllFreeImages, 150);
            });
            window.addEventListener('orientationchange', function () {
                setTimeout(relayoutAllFreeImages, 250);
            });
            // 开了自动同步 → 启动时静默拉一次（失败也不打扰，只在状态栏提示）
            // 配好了同步 → 打开就静默拉一次。原来只有开了「自动同步」才拉，
            // 手动模式下另一台删掉的东西永远看不见，这就是"删除不同步"的体感来源之一。
            if (syncConfigured()) doSyncPull(true);

            // ============================================================
            //  Service Worker（离线可用 / 添加到主屏幕）
            //  只在 https 下注册；本地双击打开（file://）时自动跳过
            // ============================================================

                        .then(function() { console.log('离线缓存已启用'); })
                        .catch(function(e) { console.warn('Service Worker 注册失败（不影响使用）:', e); });
                });
            }

            // ============================================================
            //  「装成 App」引导条
            //   · 安卓 / 桌面 Chrome：能装时会抛出 beforeinstallprompt，点按钮直接弹原生安装框
            //   · iOS Safari / 其它浏览器：没有安装 API，只能给「分享 → 添加到主屏幕」文字步骤
            //   · 已经以 App 模式打开（standalone）→ 永不显示
            //   · 点「以后再说」→ 静默 7 天；装好了 → 永久不再提示
            // ============================================================
            (function () {
                const bar = document.getElementById('installBar');
                if (!bar) return;   // 老版本页面没有这个条，安静退出

                const TITLE_EL = document.getElementById('installTitle');
                const DESC_EL = document.getElementById('installDesc');
                const GO_BTN = document.getElementById('installGoBtn');
                const HIDE_BTN = document.getElementById('installHideBtn');
                const SNOOZE_KEY = 'installHintSnooze';
                const DAY = 86400000;

                let deferredPrompt = null;

                function inAppMode() {
                    try {
                        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
                    } catch (e) { /* 老浏览器忽略 */ }
                    return window.navigator.standalone === true;
                }

                function isIOS() {
                    const ua = navigator.userAgent || '';
                    if (/iPad|iPhone|iPod/.test(ua)) return true;
                    // iPadOS 13+ 的 UA 伪装成 macOS，只能靠触摸点数区分
                    return navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1;
                }

                const isMobile = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS|MicroMessenger/i.test(navigator.userAgent || '');
                // 微信里没有「添加到主屏幕」入口，必须先「在浏览器打开」，否则给的步骤是错的
                const isWeChat = /MicroMessenger/i.test(navigator.userAgent || '');

                function snoozed() {
                    try {
                        return Date.now() - Number(localStorage.getItem(SNOOZE_KEY) || 0) < 7 * DAY;
                    } catch (e) { return false; }
                }

                function hide() {
                    bar.classList.add('hidden');
                    document.body.classList.remove('install-hint-on');
                }

                function show(title, desc, canInstall) {
                    if (TITLE_EL) TITLE_EL.textContent = title;
                    if (DESC_EL) DESC_EL.textContent = desc;
                    if (GO_BTN) GO_BTN.classList.toggle('hidden', !canInstall);
                    bar.classList.remove('hidden');
                    document.body.classList.add('install-hint-on');
                }

                // 1) 能装的时候浏览器会抛这个事件（安卓 Chrome / 桌面 Chrome / Edge）
                window.addEventListener('beforeinstallprompt', function (e) {
                    e.preventDefault();   // 拦掉浏览器自带的迷你提示，改用我们自己的条
                    deferredPrompt = e;
                    if (!inAppMode() && !snoozed()) {
                        show('装成 App，用起来更顺手', '主屏幕多一个图标，打开即全屏，断网也能查。', true);
                    }
                });

                // 2) 等不到安装事件的（iOS Safari、部分安卓浏览器）→ 给文字步骤
                if (!inAppMode() && isMobile && !snoozed()) {
                    setTimeout(function () {
                        if (deferredPrompt || !bar.classList.contains('hidden')) return;   // 已经提示过了就不重复
                        if (isWeChat) {
                            show('先「在浏览器打开」，再添加到主屏幕',
                                '微信里装不了：点右上角「…」→「在浏览器打开」→ 再按各浏览器的「添加到主屏幕」。', false);
                        } else if (isIOS()) {
                            show('添加到主屏幕，像 App 一样打开',
                                '点 Safari 底部的「分享」按钮（方框＋向上箭头）→ 往下滑找「添加到主屏幕」→ 点「添加」。', false);
                        } else {
                            // 国产安卓（vivo / OPPO / 小米 / 华为等）自带浏览器多半叫「添加到桌面」，
                            // 生成的是桌面快捷方式；真正无地址栏 + 可离线的 App 要靠 Chrome / Edge 装
                            show('添加到桌面，一键直达',
                                '点浏览器菜单（⋮ 或 ☰）→ 选「添加到桌面 / 添加到主屏幕」。'
                                + '想要没有地址栏、断网也能开的独立 App，请用 Chrome 或 Edge 打开同一网址 → 选「安装应用」。', false);
                        }
                    }, 1200);
                }

                // 3) 点「立即安装」→ 弹原生安装框
                if (GO_BTN) {
                    GO_BTN.addEventListener('click', function () {
                        if (!deferredPrompt) return;
                        deferredPrompt.prompt();
                        const p = deferredPrompt.userChoice;
                        deferredPrompt = null;
                        if (p && p.then) {
                            p.then(function (r) { if (r && r.outcome === 'accepted') hide(); })
                             .catch(function () { /* 忽略 */ });
                        }
                    });
                }

                // 4) 点「以后再说」→ 7 天不再打扰
                if (HIDE_BTN) {
                    HIDE_BTN.addEventListener('click', function () {
                        hide();
                        try { localStorage.setItem(SNOOZE_KEY, String(Date.now())); } catch (e) { /* 忽略 */ }
                    });
                }

                // 5) 装好了 → 收起，并永久不再提示
                window.addEventListener('appinstalled', function () {
                    hide();
                    try { localStorage.setItem(SNOOZE_KEY, String(Date.now() + 3650 * DAY)); } catch (e) { /* 忽略 */ }
                });
            })();
        })();
    </script>
</body>
</html>
