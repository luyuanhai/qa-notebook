<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>问答知识库</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f4f7fc;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      max-width: 1100px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0,20,40,0.25);
      padding: 28px 30px 40px;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #0b1f3b;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    h1 i { color: #2a7de1; font-size: 28px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px 12px;
      margin: 18px 0 22px;
      border-bottom: 1px solid #e6edf4;
      padding-bottom: 18px;
    }
    .left-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: white;
      border: 1px solid #d0ddee;
      padding: 8px 18px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 14px;
      color: #1f3a5f;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
      background: #f9fcff;
    }
    .btn i { font-size: 15px; color: #3a6a9e; }
    .btn-primary { background: #1a5bbf; border-color: #1a5bbf; color: white; }
    .btn-primary i { color: white; }
    .btn-primary:hover { background: #124a9e; border-color: #124a9e; }
    .btn-outline { background: transparent; border: 1px solid #d0ddee; }
    .btn-outline:hover { background: #eaf0fa; border-color: #b0c6e0; }
    .btn-danger { color: #b13e3e; border-color: #f5d6d6; }
    .btn-danger i { color: #b13e3e; }
    .btn-danger:hover { background: #ffe9e9; border-color: #dba8a8; }
    .btn-success { background: #2b8c5e; border-color: #2b8c5e; color: white; }
    .btn-success i { color: white; }
    .btn-success:hover { background: #1f6e4a; border-color: #1f6e4a; }

    .last-saved {
      font-size: 13px;
      color: #4b6a8a;
      background: #eef4fa;
      padding: 5px 16px;
      border-radius: 40px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== 搜索框 ===== */
    .search-box {
      display: flex;
      align-items: center;
      background: #f0f6fe;
      border-radius: 60px;
      padding: 4px 8px 4px 18px;
      border: 1px solid #d0ddee;
      transition: 0.2s;
      flex: 1 1 200px;
      min-width: 130px;
    }
    .search-box:focus-within {
      border-color: #2a7de1;
      box-shadow: 0 0 0 3px rgba(42,125,225,0.12);
    }
    .search-box i { color: #4a709b; font-size: 14px; }
    .search-box input {
      border: none;
      background: transparent;
      padding: 8px 6px;
      font-size: 14px;
      outline: none;
      flex: 1;
      min-width: 60px;
      color: #1a2a3a;
    }
    .search-box input::placeholder { color: #aab8c9; }
    .search-clear {
      background: none;
      border: none;
      color: #b0c0d0;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 6px;
      display: none;
    }
    .search-clear.visible { display: block; }
    .search-clear:hover { color: #2a7de1; }
    .highlight { background: #f9e66b; padding: 0 2px; border-radius: 2px; font-weight: 600; }

    /* ===== 分类标签 ===== */
    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 6px;
      margin: 6px 0 20px;
      border-bottom: 1px solid #e1eaf1;
      padding-bottom: 8px;
      align-items: center;
    }
    .category-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: #f0f5fd;
      border-radius: 40px;
      padding: 2px 2px 2px 18px;
      border: 1px solid transparent;
      transition: 0.15s;
    }
    .category-wrapper.active {
      background: #1a5bbf;
      border-color: #1a5bbf;
      box-shadow: 0 4px 8px rgba(26,91,191,0.15);
    }
    .category-wrapper.active .category-tab { color: white; }
    .category-wrapper.active .category-tab .badge { background: rgba(255,255,255,0.2); color: white; }
    .category-wrapper.active .cat-edit-btn { color: rgba(255,255,255,0.7); }
    .category-wrapper.active .cat-edit-btn:hover { color: white; }
    .category-wrapper.active .cat-del-btn { color: rgba(255,255,255,0.7); }
    .category-wrapper.active .cat-del-btn:hover { color: #ffcccc; }

    .category-tab {
      background: transparent;
      border: none;
      padding: 5px 0;
      font-size: 14px;
      font-weight: 500;
      color: #1a3b5e;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.15s;
    }
    .category-tab .badge {
      background: rgba(0,0,0,0.08);
      border-radius: 30px;
      padding: 0px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .cat-edit-btn, .cat-del-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 30px;
      color: #7a94b0;
      transition: 0.15s;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cat-edit-btn:hover { background: rgba(0,0,0,0.06); color: #2a7de1; }
    .cat-del-btn:hover { background: rgba(255,0,0,0.08); color: #d14a4a; }

    .add-category-btn {
      background: transparent;
      border: 1px dashed #b8cde0;
      padding: 5px 14px;
      border-radius: 40px;
      font-size: 13px;
      color: #2a5d8f;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
      height: 34px;
    }
    .add-category-btn:hover { background: #e6f0fe; border-color: #7fa1cc; }

    /* ===== 重要性标签 ===== */
    .importance-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 4px;
      margin: 0 0 16px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid #ecf2f9;
    }
    .imp-tab {
      border: 1px solid #dae5f0;
      padding: 4px 16px 4px 14px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: 0.2s;
      background: white;
      color: #2a4b73;
    }
    .imp-tab i { font-size: 13px; }
    .imp-tab .badge {
      background: rgba(0,0,0,0.06);
      border-radius: 30px;
      padding: 0px 8px;
      font-size: 11px;
      font-weight: 600;
      color: inherit;
    }
    .imp-tab[data-imp="important"] { background: #fee9e6; border-color: #f5cdc7; color: #a1423a; }
    .imp-tab[data-imp="important"].active { background: #fdd3cd; border-color: #d18d83; color: #7a2e26; box-shadow: 0 0 0 2px rgba(209,141,131,0.3); }
    .imp-tab[data-imp="important"] .badge { background: rgba(161,66,58,0.12); }
    .imp-tab[data-imp="normal"] { background: #e6f0fa; border-color: #c5d8ed; color: #1f5582; }
    .imp-tab[data-imp="normal"].active { background: #c9ddf5; border-color: #88adcf; color: #0f3a5e; box-shadow: 0 0 0 2px rgba(136,173,207,0.3); }
    .imp-tab[data-imp="normal"] .badge { background: rgba(31,85,130,0.12); }
    .imp-tab[data-imp="favorite"] { background: #fef6e0; border-color: #f5e5b0; color: #a77b2b; }
    .imp-tab[data-imp="favorite"].active { background: #fceec2; border-color: #dbb45a; color: #7a571a; box-shadow: 0 0 0 2px rgba(219,180,90,0.3); }
    .imp-tab[data-imp="favorite"] .badge { background: rgba(167,123,43,0.12); }
    .imp-tab[data-imp="全部"] { background: #f5f9ff; border-color: #dae5f0; color: #1f3f62; }
    .imp-tab[data-imp="全部"].active { background: #1a5bbf; border-color: #1a5bbf; color: white; }
    .imp-tab[data-imp="全部"].active i { color: white; }
    .imp-tab[data-imp="全部"] .badge { background: rgba(0,0,0,0.06); }

    /* ===== 问答卡片 ===== */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
      min-height: 180px;
    }
    .qa-item {
      background: white;
      border-radius: 20px;
      padding: 16px 20px 18px;
      border: 1px solid #e7eef7;
      box-shadow: 0 4px 8px -4px rgba(0, 20, 30, 0.06);
      transition: 0.15s;
    }
    .qa-item:hover { border-color: #cbddea; }
    .qa-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .qa-question {
      font-weight: 600;
      font-size: 17px;
      color: #0d2847;
      flex: 1 1 200px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qa-question .q-icon { font-size: 18px; color: #2a7de1; }
    .qa-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 13px;
      color: #3b5d7e;
    }
    .qa-meta .time {
      background: #f0f6fe;
      padding: 2px 12px;
      border-radius: 30px;
      font-size: 12px;
      color: #1f4b78;
    }
    .qa-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-left: 4px;
    }
    .qa-actions button {
      background: transparent;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 40px;
      font-size: 15px;
      color: #3d638b;
      cursor: pointer;
      transition: 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .qa-actions button:hover { background: #e2edfc; color: #0a3c74; }
    .qa-actions .del-btn:hover { background: #fee8e8; color: #b13e3e; }

    /* ===== 回答内容（富文本显示） ===== */
    .qa-answer {
      margin: 8px 0 10px 36px;
      padding-left: 18px;
      border-left: 3px solid #cfdef0;
      color: #1d3857;
      font-size: 15px;
      line-height: 1.8;
      word-break: break-word;
    }
    .qa-answer .answer-label {
      font-weight: 500;
      color: #3f6b97;
      margin-right: 8px;
      font-size: 13px;
    }
    .qa-answer .answer-content {
      display: inline;
    }
    .qa-answer .answer-content p {
      margin-bottom: 8px;
    }
    .qa-answer .answer-content ul,
    .qa-answer .answer-content ol {
      padding-left: 24px;
      margin-bottom: 8px;
    }
    .qa-answer .answer-content blockquote {
      border-left: 4px solid #2a7de1;
      padding-left: 16px;
      color: #4a6a8a;
      margin: 8px 0;
    }

    /* ===== 富文本编辑区 ===== */
    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 10px;
      background: #f6faff;
      border-radius: 12px 12px 0 0;
      border: 1px solid #d4e0ee;
      border-bottom: none;
    }
    .editor-toolbar button {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 14px;
      color: #3a5a7a;
      transition: 0.15s;
      min-width: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .editor-toolbar button:hover {
      background: #e8f0fe;
      border-color: #c5d8ed;
    }
    .editor-toolbar button.active {
      background: #d4e0ee;
      border-color: #a0b8d0;
    }
    .editor-toolbar select {
      border: 1px solid #d4e0ee;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 13px;
      background: white;
      outline: none;
    }
    .editor-toolbar input[type="color"] {
      width: 28px;
      height: 28px;
      border: 1px solid #d4e0ee;
      border-radius: 6px;
      padding: 2px;
      cursor: pointer;
      background: white;
    }
    .editor-toolbar .separator {
      width: 1px;
      background: #d4e0ee;
      margin: 0 4px;
    }

    .qa-answer-editor {
      width: 100%;
      min-height: 120px;
      padding: 12px 14px;
      border: 1px solid #d4e0ee;
      border-radius: 0 0 12px 12px;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.8;
      outline: none;
      background: white;
      overflow-y: auto;
    }
    .qa-answer-editor:focus {
      border-color: #2a7de1;
      box-shadow: 0 0 0 3px rgba(42,125,225,0.1);
    }
    .qa-answer-editor p {
      margin-bottom: 8px;
    }
    .qa-answer-editor ul,
    .qa-answer-editor ol {
      padding-left: 24px;
      margin-bottom: 8px;
    }
    .qa-answer-editor blockquote {
      border-left: 4px solid #2a7de1;
      padding-left: 16px;
      color: #4a6a8a;
      margin: 8px 0;
    }

    .qa-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 12px;
      border-top: 1px solid #eef4fa;
      padding-top: 12px;
    }
    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge-icon {
      border-radius: 40px;
      padding: 4px 12px 4px 10px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.1s;
      background: white;
      color: #2a4b73;
    }
    .badge-icon i { font-size: 14px; }
    .badge-icon.active { font-weight: 500; }
    .badge-icon.important { background: #fee9e6; border-color: #f5cdc7; color: #a1423a; }
    .badge-icon.important.active { background: #fdd3cd; border-color: #d18d83; }
    .badge-icon.normal { background: #e6f0fa; border-color: #c5d8ed; color: #1f5582; }
    .badge-icon.normal.active { background: #c9ddf5; border-color: #88adcf; }
    .badge-icon.favorite { background: #fef6e0; border-color: #f5e5b0; color: #a77b2b; }
    .badge-icon.favorite.active { background: #fceec2; border-color: #dbb45a; }

    .qa-category-select {
      border: 1px solid #d4e0ee;
      border-radius: 40px;
      padding: 4px 12px 4px 16px;
      font-size: 13px;
      background: white;
      color: #1f3a5f;
      cursor: pointer;
      outline: none;
      transition: 0.15s;
    }
    .qa-category-select:hover { border-color: #2a7de1; }
    .qa-category-select:focus { border-color: #2a7de1; box-shadow: 0 0 0 3px rgba(42,125,225,0.08); }

    .empty-message {
      text-align: center;
      color: #6e8bb0;
      padding: 60px 20px;
      font-size: 16px;
      background: #f6faff;
      border-radius: 60px;
      border: 1px dashed #c5d8ed;
    }
    .hidden { display: none !important; }

    /* ===== 新增问答行 ===== */
    .add-qa-row {
      background: #f6fbff;
      border-radius: 24px;
      padding: 16px 20px;
      margin: 16px 0 8px;
      border: 1px solid #dbe6f2;
    }
    .add-qa-row .field-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .add-qa-row .field-group input,
    .add-qa-row .field-group select {
      border: 1px solid #d4e0ee;
      border-radius: 40px;
      padding: 10px 18px;
      font-size: 14px;
      background: white;
      flex: 1 1 180px;
      font-family: inherit;
      outline: none;
    }
    .add-qa-row .field-group input:focus,
    .add-qa-row .field-group select:focus {
      border-color: #2a7de1;
      box-shadow: 0 0 0 3px rgba(42,125,225,0.12);
    }
    .add-qa-row .editor-wrapper {
      margin-bottom: 12px;
    }
    .add-qa-row .editor-wrapper .qa-answer-editor {
      border-radius: 0 0 12px 12px;
      min-height: 100px;
    }
    .add-qa-row .btn-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    @media (max-width: 700px) {
      .app-container { padding: 20px 16px; }
      .qa-answer { margin-left: 0; padding-left: 12px; }
      .search-box { flex: 1 1 100%; margin-top: 6px; }
      .category-wrapper { padding: 2px 2px 2px 12px; }
      .category-tab { font-size: 13px; }
      .editor-toolbar { gap: 2px; }
      .editor-toolbar button { padding: 3px 6px; font-size: 13px; }
    }
  </style>
</head>
<body>
<div class="app-container" id="app">
  <header style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
    <h1><i class="fas fa-comment-dots"></i> 问答知识库</h1>
    <div class="last-saved" id="lastSavedDisplay"><i class="far fa-clock"></i> 最新编辑: <span id="lastSavedTime">--</span></div>
  </header>

  <div class="toolbar">
    <div class="left-actions">
      <button class="btn btn-primary" id="addQaBtn"><i class="fas fa-plus-circle"></i> 新增问答</button>
      <button class="btn btn-success" id="restoreBtn"><i class="fas fa-undo-alt"></i> 恢复案例</button>
      <button class="btn btn-outline" id="exportWordBtn"><i class="fas fa-file-word"></i> 导出Word</button>
      <button class="btn btn-outline" id="clearAllBtn"><i class="fas fa-trash-alt"></i> 清空全部</button>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="搜索问答..." />
        <button class="search-clear" id="searchClear"><i class="fas fa-times-circle"></i></button>
      </div>
    </div>
  </div>

  <div class="importance-tabs" id="importanceTabsContainer"></div>
  <div class="category-tabs" id="categoryTabsContainer"></div>
  <div id="qaListContainer" class="qa-list"></div>

  <!-- ===== 新增问答行（带富文本编辑器） ===== -->
  <div class="add-qa-row hidden" id="addQaRow">
    <div class="field-group">
      <input type="text" id="newQuestionInput" placeholder="问题标题" />
      <select id="newCategorySelect" style="border-radius:40px;padding:10px 18px;border:1px solid #d4e0ee;background:white;font-size:14px;"></select>
    </div>
    <div class="editor-wrapper">
      <!-- 工具栏 -->
      <div class="editor-toolbar" id="editorToolbar">
        <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
        <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
        <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
        <span class="separator"></span>
        <select id="fontSizeSelect" title="字体大小">
          <option value="3">正常</option>
          <option value="4">大</option>
          <option value="5">更大</option>
          <option value="6">最大</option>
          <option value="1">极小</option>
          <option value="2">小</option>
        </select>
        <span class="separator"></span>
        <input type="color" id="colorPicker" value="#1d3857" title="文字颜色">
        <span class="separator"></span>
        <button type="button" data-cmd="insertUnorderedList" title="无序列表"><i class="fas fa-list-ul"></i></button>
        <button type="button" data-cmd="insertOrderedList" title="有序列表"><i class="fas fa-list-ol"></i></button>
        <span class="separator"></span>
        <button type="button" data-cmd="indent" title="增加缩进"><i class="fas fa-indent"></i></button>
        <button type="button" data-cmd="outdent" title="减少缩进"><i class="fas fa-outdent"></i></button>
        <span class="separator"></span>
        <button type="button" data-cmd="removeFormat" title="清除格式"><i class="fas fa-eraser"></i></button>
      </div>
      <!-- 编辑器 -->
      <div class="qa-answer-editor" id="newAnswerEditor" contenteditable="true" placeholder="回答内容…"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="confirmAddBtn"><i class="fas fa-check"></i> 添加</button>
      <button class="btn btn-outline" id="cancelAddBtn">取消</button>
    </div>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ============================================================
    //  数据
    // ============================================================
    let qaData = [];
    let categories = ['全部', '默认'];
    let currentCategory = '全部';
    let currentImportance = '全部';
    let searchKeyword = '';
    let nextId = 1000;
    let lastEditTime = new Date();

    // DOM 引用
    const container = document.getElementById('qaListContainer');
    const tabsContainer = document.getElementById('categoryTabsContainer');
    const impTabsContainer = document.getElementById('importanceTabsContainer');
    const lastSavedSpan = document.getElementById('lastSavedTime');
    const addRow = document.getElementById('addQaRow');
    const newQuestion = document.getElementById('newQuestionInput');
    const newAnswerEditor = document.getElementById('newAnswerEditor');
    const newCategorySelect = document.getElementById('newCategorySelect');
    const confirmAddBtn = document.getElementById('confirmAddBtn');
    const cancelAddBtn = document.getElementById('cancelAddBtn');
    const addQaBtn = document.getElementById('addQaBtn');
    const exportBtn = document.getElementById('exportWordBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const restoreBtn = document.getElementById('restoreBtn');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');

    // ============================================================
    //  工具函数
    // ============================================================
    function formatTime(date) {
      const d = date || new Date();
      const fmt = n => n.toString().padStart(2, '0');
      return `${d.getFullYear()}-${fmt(d.getMonth() + 1)}-${fmt(d.getDate())} ${fmt(d.getHours())}:${fmt(d.getMinutes())}`;
    }

    function updateLastSaved() {
      lastSavedSpan.textContent = formatTime(lastEditTime);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function highlightText(text, keyword) {
      if (!keyword || !text) return text;
      const kw = escapeHtml(keyword);
      try {
        const regex = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        return text.replace(regex, match => `<span class="highlight">${match}</span>`);
      } catch (e) {
        return text;
      }
    }

    // 从HTML中提取纯文本用于搜索
    function stripHtml(html) {
      if (!html) return '';
      const div = document.createElement('div');
      div.innerHTML = html;
      return div.textContent || div.innerText || '';
    }

    // ============================================================
    //  数据持久化
    // ============================================================
    function saveData() {
      try {
        localStorage.setItem('qaData', JSON.stringify(qaData));
        localStorage.setItem('categories', JSON.stringify(categories));
        localStorage.setItem('nextId', String(nextId));
        localStorage.setItem('lastEditTime', JSON.stringify(lastEditTime));
      } catch (e) {
        console.warn('保存失败:', e);
      }
    }

    function loadData() {
      try {
        const saved = localStorage.getItem('qaData');
        if (saved) {
          qaData = JSON.parse(saved);
          const cats = localStorage.getItem('categories');
          if (cats) categories = JSON.parse(cats);
          const id = localStorage.getItem('nextId');
          if (id) nextId = parseInt(id);
          const time = localStorage.getItem('lastEditTime');
          if (time) lastEditTime = new Date(JSON.parse(time));
          return true;
        }
      } catch (e) {
        console.warn('加载失败:', e);
      }
      return false;
    }

    // ============================================================
    //  生成案例问答
    // ============================================================
    function getSampleData() {
      const now = new Date();
      const t = formatTime(now);
      return [
        { id: 1000, question: '📌 如何快速上手？', answer: '<p>点击"<strong>新增问答</strong>"添加内容，用"<strong>重要/一般/收藏</strong>"标记优先级，通过分类和搜索快速筛选。</p><p>支持富文本编辑：<strong>加粗</strong>、<em>斜体</em>、<u>下划线</u>、不同<font size="5">字体大小</font>和<font color="#e74c3c">颜色</font>。</p>', category: '默认', importance: 'important', time: t },
        { id: 1001, question: '💡 数据存在哪里？安全吗？', answer: '<p>所有数据保存在您<strong>浏览器本地</strong>，不会上传任何服务器。建议定期用"导出Word"备份。</p><ul><li>换设备需要手动导入导出</li><li>清除浏览器网站数据会丢失</li></ul>', category: '默认', importance: 'important', time: t },
        { id: 1002, question: '📂 如何创建和管理分类？', answer: '<p>点击"<strong>新建分类</strong>"创建。鼠标悬停在分类标签上，会出现 ✏️ 和 🗑️ 按钮，可编辑或删除分类。</p><ol><li>点击"新建分类"输入名称</li><li>悬停分类标签点击✏️重命名</li><li>点击🗑️删除分类（问答自动移到"默认"）</li></ol>', category: '默认', importance: 'normal', time: t },
        { id: 1003, question: '⭐ 收藏功能有什么用？', answer: '<p>点击问答下方的"<strong>收藏</strong>"按钮标记，再点击顶部"<strong>收藏</strong>"标签，即可快速查看所有收藏内容。</p><blockquote>小提示：结合分类筛选，可以更精准地管理知识库。</blockquote>', category: '默认', importance: 'favorite', time: t },
        { id: 1004, question: '🔍 如何搜索问答？', answer: '<p>在右上角搜索框输入关键词，系统会实时筛选匹配的问题和回答，匹配内容会<mark>高亮显示</mark>。</p><p>搜索范围包括：<strong>问题标题</strong>和<strong>回答正文</strong>。</p>', category: '默认', importance: 'normal', time: t },
      ];
    }

    // ============================================================
    //  初始化数据
    // ============================================================
    function initData() {
      const hasData = loadData();
      if (!hasData || qaData.length === 0) {
        qaData = getSampleData();
        const cats = new Set(qaData.map(item => item.category));
        categories = ['全部', ...Array.from(cats)];
        nextId = 1005;
        lastEditTime = new Date();
        saveData();
      }
      updateLastSaved();
    }

    // ============================================================
    //  恢复案例问答
    // ============================================================
    function restoreSampleData() {
      if (qaData.length > 0) {
        if (!confirm('⚠️ 恢复案例将清空当前所有数据，确定继续吗？')) return;
      }
      qaData = getSampleData();
      const cats = new Set(qaData.map(item => item.category));
      categories = ['全部', ...Array.from(cats)];
      currentCategory = '全部';
      currentImportance = '全部';
      searchKeyword = '';
      searchInput.value = '';
      searchClear.classList.remove('visible');
      nextId = 1005;
      lastEditTime = new Date();
      saveData();
      renderAll();
    }

    // ============================================================
    //  分类管理
    // ============================================================
    function editCategory(oldName, newName) {
      if (oldName === '全部') { alert('不能编辑"全部"分类'); return; }
      if (!newName || newName.trim() === '') { alert('分类名称不能为空'); return; }
      newName = newName.trim();
      if (categories.includes(newName) && newName !== oldName) {
        alert('分类名称已存在');
        return;
      }
      const index = categories.indexOf(oldName);
      if (index > -1) categories[index] = newName;
      qaData.forEach(item => {
        if (item.category === oldName) item.category = newName;
      });
      if (currentCategory === oldName) currentCategory = newName;
      lastEditTime = new Date();
      updateLastSaved();
      saveData();
      renderAll();
    }

    function deleteCategory(catName) {
      if (catName === '全部' || catName === '默认') {
        alert('不能删除系统分类');
        return;
      }
      if (!confirm(`确定删除分类“${catName}”吗？该分类下的问答将移到"默认"分类。`)) return;
      categories = categories.filter(c => c !== catName);
      qaData.forEach(item => {
        if (item.category === catName) item.category = '默认';
      });
      if (currentCategory === catName) currentCategory = '全部';
      if (!categories.includes('默认')) categories.push('默认');
      lastEditTime = new Date();
      updateLastSaved();
      saveData();
      renderAll();
    }

    // ============================================================
    //  富文本编辑器命令
    // ============================================================
    function execEditorCommand(cmd, value) {
      document.execCommand(cmd, false, value || null);
      newAnswerEditor.focus();
    }

    function setupEditorToolbar() {
      const toolbar = document.getElementById('editorToolbar');

      // 格式按钮
      toolbar.querySelectorAll('[data-cmd]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const cmd = this.dataset.cmd;
          execEditorCommand(cmd);
        });
      });

      // 字体大小
      document.getElementById('fontSizeSelect').addEventListener('change', function() {
        execEditorCommand('fontSize', this.value);
        this.value = '3'; // 重置
      });

      // 颜色
      document.getElementById('colorPicker').addEventListener('input', function() {
        execEditorCommand('foreColor', this.value);
      });

      // 回车键不产生<div>而是<p>
      newAnswerEditor.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          document.execCommand('insertParagraph', false, null);
          e.preventDefault();
        }
      });

      // placeholder效果
      newAnswerEditor.addEventListener('focus', function() {
        if (this.innerHTML === '<p><br></p>' || this.innerText.trim() === '') {
          this.innerHTML = '';
        }
      });
    }

    // ============================================================
    //  渲染函数
    // ============================================================
    function populateCategorySelect() {
      const currentVal = newCategorySelect.value;
      newCategorySelect.innerHTML = '';
      categories.forEach(cat => {
        if (cat === '全部') return;
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        newCategorySelect.appendChild(opt);
      });
      if (categories.includes(currentVal) && currentVal !== '全部') {
        newCategorySelect.value = currentVal;
      } else {
        newCategorySelect.value = categories.length > 1 ? categories[1] : '默认';
      }
    }

    function getFilteredData() {
      let filtered = qaData;
      if (currentCategory !== '全部') {
        filtered = filtered.filter(item => item.category === currentCategory);
      }
      if (currentImportance !== '全部') {
        filtered = filtered.filter(item => item.importance === currentImportance);
      }
      if (searchKeyword.trim() !== '') {
        const kw = searchKeyword.trim().toLowerCase();
        filtered = filtered.filter(item => {
          const qText = stripHtml(item.question);
          const aText = stripHtml(item.answer);
          return qText.toLowerCase().includes(kw) || aText.toLowerCase().includes(kw);
        });
      }
      return filtered;
    }

    function refreshCategories() {
      const cats = new Set(qaData.map(item => item.category));
      let newCats = ['全部', ...Array.from(cats)];
      if (newCats.length === 1) newCats.push('默认');
      categories = newCats;
      if (!categories.includes(currentCategory) && currentCategory !== '全部') {
        currentCategory = '全部';
      }
    }

    function renderImportanceTabs() {
      const fragment = document.createDocumentFragment();
      const impTypes = [
        { key: '全部', label: '全部', icon: 'fa-list' },
        { key: 'important', label: '重要', icon: 'fa-exclamation-circle' },
        { key: 'normal', label: '一般', icon: 'fa-circle' },
        { key: 'favorite', label: '收藏', icon: 'fa-star' },
      ];
      impTypes.forEach(type => {
        const tab = document.createElement('button');
        tab.className = `imp-tab${currentImportance === type.key ? ' active' : ''}`;
        tab.dataset.imp = type.key;
        const count = type.key === '全部' ? qaData.length : qaData.filter(item => item.importance === type.key).length;
        tab.innerHTML = `<i class="fas ${type.icon}"></i> ${type.label} <span class="badge">${count}</span>`;
        tab.addEventListener('click', function() {
          currentImportance = this.dataset.imp;
          renderImportanceTabs();
          renderQaList();
        });
        fragment.appendChild(tab);
      });
      impTabsContainer.innerHTML = '';
      impTabsContainer.appendChild(fragment);
    }

    function renderTabs() {
      const fragment = document.createDocumentFragment();
      categories.forEach(cat => {
        const wrapper = document.createElement('span');
        wrapper.className = `category-wrapper${cat === currentCategory ? ' active' : ''}`;

        const tab = document.createElement('button');
        tab.className = 'category-tab';
        const count = cat === '全部' ? qaData.length : qaData.filter(item => item.category === cat).length;
        tab.innerHTML = `${cat} <span class="badge">${count}</span>`;
        tab.addEventListener('click', function(e) {
          e.stopPropagation();
          currentCategory = cat;
          renderTabs();
          renderQaList();
        });
        wrapper.appendChild(tab);

        if (cat !== '全部') {
          const editBtn = document.createElement('button');
          editBtn.className = 'cat-edit-btn';
          editBtn.innerHTML = '<i class="fas fa-pen"></i>';
          editBtn.title = '编辑分类名称';
          editBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const newName = prompt('请输入新的分类名称：', cat);
            if (newName !== null && newName.trim() !== '' && newName.trim() !== cat) {
              editCategory(cat, newName.trim());
            } else if (newName !== null && newName.trim() === '') {
              alert('分类名称不能为空');
            }
          });
          wrapper.appendChild(editBtn);

          if (cat !== '默认') {
            const delBtn = document.createElement('button');
            delBtn.className = 'cat-del-btn';
            delBtn.innerHTML = '<i class="fas fa-trash"></i>';
            delBtn.title = '删除分类';
            delBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              deleteCategory(cat);
            });
            wrapper.appendChild(delBtn);
          }
        }

        fragment.appendChild(wrapper);
      });

      const addCatBtn = document.createElement('button');
      addCatBtn.className = 'add-category-btn';
      addCatBtn.innerHTML = '<i class="fas fa-plus-circle"></i> 新建分类';
      addCatBtn.addEventListener('click', function() {
        const newCat = prompt('请输入新分类名称:');
        if (newCat && newCat.trim() !== '' && !categories.includes(newCat.trim())) {
          categories.push(newCat.trim());
          currentCategory = newCat.trim();
          renderTabs();
          renderQaList();
          populateCategorySelect();
          saveData();
        } else if (newCat && categories.includes(newCat.trim())) {
          alert('分类已存在');
        }
      });
      fragment.appendChild(addCatBtn);

      tabsContainer.innerHTML = '';
      tabsContainer.appendChild(fragment);
    }

    function moveQaToCategory(itemId, newCategory) {
      const item = qaData.find(q => q.id === itemId);
      if (!item || item.category === newCategory) return;
      item.category = newCategory;
      item.time = formatTime(new Date());
      lastEditTime = new Date();
      updateLastSaved();
      if (!categories.includes(newCategory)) categories.push(newCategory);
      refreshCategories();
      if (!categories.includes(currentCategory) && currentCategory !== '全部') currentCategory = '全部';
      renderTabs();
      renderQaList();
      renderImportanceTabs();
      populateCategorySelect();
      saveData();
    }

    function renderQaList() {
      const filtered = getFilteredData();
      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-message"><i class="fas fa-inbox" style="font-size:28px;display:block;margin-bottom:12px;opacity:0.5;"></i> ${searchKeyword.trim() ? '没有匹配的问答' : '当前分类没有问答，点击 "新增问答" 创建'}</div>`;
        return;
      }
      const fragment = document.createDocumentFragment();
      const kw = searchKeyword.trim();
      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'qa-item';
        div.dataset.id = item.id;

        const header = document.createElement('div');
        header.className = 'qa-header';
        const qDiv = document.createElement('div');
        qDiv.className = 'qa-question';
        const qHtml = kw ? highlightText(escapeHtml(item.question), kw) : escapeHtml(item.question);
        qDiv.innerHTML = `<span class="q-icon"><i class="fas fa-question-circle"></i></span> ${qHtml}`;

        const meta = document.createElement('div');
        meta.className = 'qa-meta';
        meta.innerHTML = `<span class="time"><i class="far fa-calendar-alt"></i> ${item.time || '--'}</span>
          <span class="qa-actions">
            <button class="edit-btn" title="编辑回答"><i class="fas fa-pen"></i></button>
            <button class="del-btn" title="删除"><i class="fas fa-trash"></i></button>
          </span>`;
        header.appendChild(qDiv);
        header.appendChild(meta);

        // 回答（富文本显示）
        const ansDiv = document.createElement('div');
        ansDiv.className = 'qa-answer';
        const answerContent = document.createElement('div');
        answerContent.className = 'answer-content';
        // 高亮处理（在HTML中搜索关键词）
        let answerHtml = item.answer || '';
        if (kw) {
          const textOnly = stripHtml(answerHtml);
          if (textOnly.toLowerCase().includes(kw.toLowerCase())) {
            // 简单高亮：在文本中替换
            const escapedKw = escapeHtml(kw);
            const regex = new RegExp(escapedKw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            answerHtml = answerHtml.replace(regex, match => `<span class="highlight">${match}</span>`);
          }
        }
        answerContent.innerHTML = answerHtml || '<span style="color:#aaa;">（空回答）</span>';
        ansDiv.innerHTML = `<span class="answer-label"><i class="far fa-comment"></i> 回答</span> `;
        ansDiv.appendChild(answerContent);

        const footer = document.createElement('div');
        footer.className = 'qa-footer';
        const badgeGroup = document.createElement('div');
        badgeGroup.className = 'badge-group';

        const types = [
          { key: 'important', label: '重要', icon: 'fas fa-exclamation-circle' },
          { key: 'normal', label: '一般', icon: 'fas fa-circle' },
          { key: 'favorite', label: '收藏', icon: 'fas fa-star' },
        ];
        types.forEach(type => {
          const span = document.createElement('span');
          span.className = `badge-icon ${type.key}${item.importance === type.key ? ' active' : ''}`;
          span.innerHTML = `<i class="${type.icon}"></i> ${type.label}`;
          span.addEventListener('click', function(e) {
            e.stopPropagation();
            item.importance = (item.importance === type.key) ? 'normal' : type.key;
            lastEditTime = new Date();
            updateLastSaved();
            renderQaList();
            renderTabs();
            renderImportanceTabs();
            saveData();
          });
          badgeGroup.appendChild(span);
        });

        // 分类下拉选择
        const catSelect = document.createElement('select');
        catSelect.className = 'qa-category-select';
        const allCats = categories.filter(c => c !== '全部');
        allCats.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          if (cat === item.category) opt.selected = true;
          catSelect.appendChild(opt);
        });
        if (!allCats.includes(item.category)) {
          const opt = document.createElement('option');
          opt.value = item.category;
          opt.textContent = item.category;
          opt.selected = true;
          catSelect.appendChild(opt);
        }
        catSelect.addEventListener('change', function() {
          moveQaToCategory(item.id, this.value);
        });

        const catWrapper = document.createElement('span');
        catWrapper.style.display = 'inline-flex';
        catWrapper.style.alignItems = 'center';
        catWrapper.style.gap = '4px';
        catWrapper.innerHTML = `<i class="fas fa-tag" style="color:#22558a;font-size:13px;"></i>`;
        catWrapper.appendChild(catSelect);

        footer.appendChild(badgeGroup);
        footer.appendChild(catWrapper);

        div.appendChild(header);
        div.appendChild(ansDiv);
        div.appendChild(footer);

        // 删除事件
        const delBtn = div.querySelector('.del-btn');
        delBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (confirm(`确定删除问答：“${item.question}” ？`)) {
            qaData = qaData.filter(q => q.id !== item.id);
            refreshCategories();
            if (!categories.includes(currentCategory) && currentCategory !== '全部') currentCategory = '全部';
            lastEditTime = new Date();
            updateLastSaved();
            renderTabs();
            renderQaList();
            renderImportanceTabs();
            populateCategorySelect();
            saveData();
          }
        });

        // 编辑回答（使用富文本编辑器）
        const editBtn = div.querySelector('.edit-btn');
        editBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          const answerDiv = div.querySelector('.qa-answer');
          const currentHtml = item.answer || '';

          // 保存原有内容
          const oldContent = answerDiv.innerHTML;

          // 替换为编辑器
          const editorWrapper = document.createElement('div');
          editorWrapper.style.width = '100%';

          // 工具栏
          const toolbar = document.createElement('div');
          toolbar.className = 'editor-toolbar';
          toolbar.innerHTML = `
            <button type="button" data-cmd="bold"><b>B</b></button>
            <button type="button" data-cmd="italic"><i>I</i></button>
            <button type="button" data-cmd="underline"><u>U</u></button>
            <span class="separator"></span>
            <select class="edit-font-size">
              <option value="3">正常</option>
              <option value="4">大</option>
              <option value="5">更大</option>
              <option value="6">最大</option>
              <option value="1">极小</option>
              <option value="2">小</option>
            </select>
            <span class="separator"></span>
            <input type="color" class="edit-color" value="#1d3857">
            <span class="separator"></span>
            <button type="button" data-cmd="insertUnorderedList"><i class="fas fa-list-ul"></i></button>
            <button type="button" data-cmd="insertOrderedList"><i class="fas fa-list-ol"></i></button>
            <span class="separator"></span>
            <button type="button" data-cmd="indent"><i class="fas fa-indent"></i></button>
            <button type="button" data-cmd="outdent"><i class="fas fa-outdent"></i></button>
            <span class="separator"></span>
            <button type="button" data-cmd="removeFormat"><i class="fas fa-eraser"></i></button>
          `;
          editorWrapper.appendChild(toolbar);

          // 编辑器
          const editor = document.createElement('div');
          editor.className = 'qa-answer-editor';
          editor.contentEditable = true;
          editor.innerHTML = currentHtml || '<p><br></p>';
          editorWrapper.appendChild(editor);

          // 按钮组
          const btnGroup = document.createElement('div');
          btnGroup.style.cssText = 'margin-top:10px;display:flex;gap:10px;';
          const saveEditBtn = document.createElement('button');
          saveEditBtn.className = 'btn btn-primary';
          saveEditBtn.innerHTML = '<i class="fas fa-check"></i> 保存';
          const cancelEditBtn = document.createElement('button');
          cancelEditBtn.className = 'btn btn-outline';
          cancelEditBtn.innerHTML = '取消';
          btnGroup.appendChild(saveEditBtn);
          btnGroup.appendChild(cancelEditBtn);
          editorWrapper.appendChild(btnGroup);

          // 替换内容
          answerDiv.innerHTML = '';
          answerDiv.appendChild(editorWrapper);

          // 编辑器聚焦
          setTimeout(() => editor.focus(), 50);

          // 工具栏命令
          toolbar.querySelectorAll('[data-cmd]').forEach(btn => {
            btn.addEventListener('click', function(e) {
              e.preventDefault();
              document.execCommand(this.dataset.cmd, false, null);
              editor.focus();
            });
          });

          toolbar.querySelector('.edit-font-size').addEventListener('change', function() {
            document.execCommand('fontSize', false, this.value);
            this.value = '3';
            editor.focus();
          });

          toolbar.querySelector('.edit-color').addEventListener('input', function() {
            document.execCommand('foreColor', false, this.value);
            editor.focus();
          });

          // 回车键
          editor.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
              document.execCommand('insertParagraph', false, null);
              e.preventDefault();
            }
          });

          // 保存
          saveEditBtn.addEventListener('click', function() {
            const newHtml = editor.innerHTML.trim();
            if (!newHtml || newHtml === '<p><br></p>' || newHtml === '<br>') {
              alert('回答内容不能为空');
              return;
            }
            item.answer = newHtml;
            item.time = formatTime(new Date());
            lastEditTime = new Date();
            updateLastSaved();
            renderQaList();
            renderTabs();
            renderImportanceTabs();
            saveData();
          });

          // 取消
          cancelEditBtn.addEventListener('click', function() {
            answerDiv.innerHTML = oldContent;
          });
        });

        fragment.appendChild(div);
      });
      container.innerHTML = '';
      container.appendChild(fragment);
    }

    // ============================================================
    //  搜索功能
    // ============================================================
    searchInput.addEventListener('input', function() {
      searchKeyword = this.value;
      searchClear.classList.toggle('visible', searchKeyword.length > 0);
      renderQaList();
    });

    searchClear.addEventListener('click', function() {
      searchInput.value = '';
      searchKeyword = '';
      searchClear.classList.remove('visible');
      renderQaList();
    });

    // ============================================================
    //  新增问答（使用富文本编辑器）
    // ============================================================
    function addNewQA() {
      const q = newQuestion.value.trim();
      const a = newAnswerEditor.innerHTML.trim();
      const cat = newCategorySelect.value || '默认';
      if (!q) { alert('问题不能为空'); return; }
      if (!a || a === '<p><br></p>' || a === '<br>') { alert('回答内容不能为空'); return; }

      const newItem = {
        id: nextId++,
        question: q,
        answer: a,
        category: cat,
        importance: 'normal',
        time: formatTime(new Date())
      };
      qaData.push(newItem);
      if (!categories.includes(cat)) categories.push(cat);
      currentCategory = cat;
      lastEditTime = new Date();
      updateLastSaved();
      newQuestion.value = '';
      newAnswerEditor.innerHTML = '<p><br></p>';
      renderTabs();
      renderQaList();
      renderImportanceTabs();
      populateCategorySelect();
      addRow.classList.add('hidden');
      saveData();
    }

    function showAddRow() {
      addRow.classList.remove('hidden');
      newQuestion.focus();
      populateCategorySelect();
      newAnswerEditor.innerHTML = '<p><br></p>';
    }

    // ============================================================
    //  导出Word
    // ============================================================
    function exportWord() {
      if (qaData.length === 0) {
        alert('没有问答可以导出');
        return;
      }
      let htmlContent = `<html><head><meta charset="UTF-8"><title>问答导出</title><style>body{font-family:'Segoe UI',Arial,sans-serif;padding:30px;}.qa{margin-bottom:30px;border-bottom:1px solid #ddd;padding-bottom:20px;}.q{font-weight:bold;font-size:20px;margin-bottom:8px;}.a{margin:8px 0 6px 20px;line-height:1.8;}.meta{color:#4a6a8a;font-size:14px;margin-top:6px;}.cat{background:#eef3f9;padding:2px 14px;border-radius:20px;}ul,ol{padding-left:24px;}blockquote{border-left:4px solid #2a7de1;padding-left:16px;color:#4a6a8a;}</style></head><body><h1>📋 问答知识库 导出</h1><p>导出时间: ${formatTime(new Date())}</p>`;
      qaData.forEach(item => {
        htmlContent += `<div class="qa"><div class="q">❓ ${escapeHtml(item.question)}</div><div class="a">💬 ${item.answer || ''}</div><div class="meta">分类: <span class="cat">${escapeHtml(item.category)}</span>  ·  重要性: ${item.importance}  ·  更新: ${item.time}</div></div>`;
      });
      htmlContent += '</body></html>';
      const blob = new Blob([htmlContent], { type: 'application/msword' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `问答导出_${formatTime(new Date()).replace(/[: ]/g,'_')}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // ============================================================
    //  清空全部
    // ============================================================
    function clearAll() {
      if (qaData.length === 0) return;
      if (confirm('⚠️ 确定清空所有问答吗？')) {
        qaData = [];
        categories = ['全部', '默认'];
        currentCategory = '全部';
        currentImportance = '全部';
        searchKeyword = '';
        searchInput.value = '';
        searchClear.classList.remove('visible');
        lastEditTime = new Date();
        updateLastSaved();
        renderTabs();
        renderQaList();
        renderImportanceTabs();
        populateCategorySelect();
        saveData();
      }
    }

    // ============================================================
    //  渲染所有
    // ============================================================
    function renderAll() {
      renderImportanceTabs();
      renderTabs();
      renderQaList();
      populateCategorySelect();
      updateLastSaved();
    }

    // ============================================================
    //  事件绑定
    // ============================================================
    addQaBtn.addEventListener('click', showAddRow);
    cancelAddBtn.addEventListener('click', function() {
      addRow.classList.add('hidden');
      newQuestion.value = '';
      newAnswerEditor.innerHTML = '<p><br></p>';
    });
    confirmAddBtn.addEventListener('click', addNewQA);
    exportBtn.addEventListener('click', exportWord);
    clearAllBtn.addEventListener('click', clearAll);
    restoreBtn.addEventListener('click', restoreSampleData);

    // 键盘快捷键：Ctrl+Enter 提交
    newAnswerEditor.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        addNewQA();
      }
    });

    // ============================================================
    //  启动
    // ============================================================
    initData();
    setupEditorToolbar();
    renderAll();
    addRow.classList.add('hidden');
  })();
</script>
</body>
</html>
