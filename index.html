            // ============================================================
            //  工具函数
            // ============================================================
            function formatTime(date) {
                const d = date || new Date();
                const fmt = n => n.toString().padStart(2, '0');
                return `${d.getFullYear()}-${fmt(d.getMonth() + 1)}-${fmt(d.getDate())} ${fmt(d.getHours())}:${fmt(d.getMinutes())}`;
            }

            function updateLastSaved() {
                lastSavedSpan.textContent = formatTime(lastEditTime);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function escapeRegExp(str) {
                return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            /**
             * 只替换纯文本节点做高亮，绝不碰标签属性。
             * 回答里现在可能内嵌 base64 图片，用正则全局替换会直接打爆 img 的 src。
             */
            function highlightHtml(html, keyword) {
                if (!keyword) return html || '';
                const holder = document.createElement('div');
                holder.innerHTML = html || '';
                const walker = document.createTreeWalker(holder, NodeFilter.SHOW_TEXT, null, false);
                const textNodes = [];
                while (walker.nextNode()) textNodes.push(walker.currentNode);

                const regex = new RegExp(escapeRegExp(keyword), 'gi');
                textNodes.forEach(node => {
                    const text = node.nodeValue;
                    if (!text) return;
                    regex.lastIndex = 0;
                    if (!regex.test(text)) return;
                    regex.lastIndex = 0;

                    const frag = document.createDocumentFragment();
                    let last = 0;
                    let m;
                    while ((m = regex.exec(text)) !== null) {
                        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
                        const span = document.createElement('span');
                        span.className = 'highlight';
                        span.textContent = m[0];
                        frag.appendChild(span);
                        last = m.index + m[0].length;
                        if (m[0].length === 0) regex.lastIndex++;
                    }
                    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
                    node.parentNode.replaceChild(frag, node);
                });
                return holder.innerHTML;
            }

            function highlightText(text, keyword) {
                if (!keyword || !text) return text;
                const kw = escapeHtml(keyword);
                try {
                    const regex = new RegExp(escapeRegExp(kw), 'gi');
                    return text.replace(regex, match => `<span class="highlight">${match}</span>`);
                } catch (e) {
                    return text;
                }
            }

            function stripHtml(html) {
                if (!html) return '';
                const div = document.createElement('div');
                div.innerHTML = html;
                return div.textContent || div.innerText || '';
            }

            // ============================================================
            //  【新增】图片处理：压缩 + 转 dataURL
            // ============================================================
            const IMG_MAX_SIDE = 1600;        // 长边上限
            const IMG_KEEP_ORIGIN_BYTES = 260 * 1024; // 小图直接原样内嵌，保真

            function estimateBytes(dataUrl) {
                const i = dataUrl.indexOf(',');
                if (i < 0) return dataUrl.length;
                const b64 = dataUrl.slice(i + 1);
                const padding = (b64.match(/=+$/) || [''])[0].length;
                return Math.floor(b64.length * 3 / 4) - padding;
            }

            function fileToDataUrl(file) {
                return new Promise((resolve, reject) => {
                    const fr = new FileReader();
                    fr.onload = () => resolve(fr.result);
                    fr.onerror = () => reject(new Error('读取文件失败'));
                    fr.readAsDataURL(file);
                });
            }

            /** 大图走 canvas 重采样压缩，避免 localStorage 被撑爆 */
            async function processImageFile(file) {
                const raw = await fileToDataUrl(file);
                if (file.size <= IMG_KEEP_ORIGIN_BYTES) return raw;

                const dataUrl = await new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.naturalWidth || img.width;
                        let h = img.naturalHeight || img.height;
                        const scale = Math.min(1, IMG_MAX_SIDE / Math.max(w, h));
                        w = Math.max(1, Math.round(w * scale));
                        h = Math.max(1, Math.round(h * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, w, h);
                        ctx.drawImage(img, 0, 0, w, h);
                        let out = canvas.toDataURL('image/jpeg', 0.82);
                        if (estimateBytes(out) > estimateBytes(raw)) out = raw; // 压了反而更大就用原图
                        resolve(out);
                    };
                    img.onerror = () => resolve(raw);
                    img.src = raw;
                });
                return dataUrl;
            }

            // ============================================================
            //  【新增】光标保存 / 恢复（打开文件对话框会丢焦点）
            // ============================================================
            let savedRange = null;

            function saveCaret(editor) {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return;
                const range = sel.getRangeAt(0);
                if (editor.contains(range.commonAncestorContainer)) savedRange = range.cloneRange();
            }

            function restoreCaret(editor) {
                editor.focus();
                const sel = window.getSelection();
                sel.removeAllRanges();
                if (savedRange && editor.contains(savedRange.commonAncestorContainer)) {
                    sel.addRange(savedRange);
                    return;
                }
                const r = document.createRange();
                r.selectNodeContents(editor);
                r.collapse(false);
                sel.addRange(r);
            }

            // ============================================================
            //  【新增】插入图片（支持多张）
            // ============================================================
            function pickImages(editor) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.multiple = true;
                input.style.display = 'none';
                input.addEventListener('change', function() {
                    const files = Array.from(input.files || []);
                    insertImageFiles(editor, files);
                    input.remove();
                });
                document.body.appendChild(input);
                input.click();
            }

            async function insertImageFiles(editor, files) {
                const imgFiles = (files || []).filter(f => f && f.type && f.type.indexOf('image/') === 0);
                if (imgFiles.length === 0) return;

                restoreCaret(editor);
                let total = 0;
                for (let i = 0; i < imgFiles.length; i++) {
                    let dataUrl;
                    try {
                        dataUrl = await processImageFile(imgFiles[i]);
                    } catch (err) {
                        console.warn('图片处理失败:', err);
                        continue;
                    }
                    total += estimateBytes(dataUrl);
                    // 每张图后面补一个空段落，方便继续打字 / 继续插图
                    const html = `<img class="qa-img" src="${dataUrl}" alt="" draggable="true"><p><br></p>`;
                    document.execCommand('insertHTML', false, html);
                }
                normalizeEditorImages(editor);
                syncFreeHeight(editor);
                if (total > 2 * 1024 * 1024) {
                    console.info('本次插入图片约 ' + (total / 1024 / 1024).toFixed(2) + ' MB，注意浏览器本地存储上限约 5MB');
                }
            }

            /** 给外部粘贴进来的 <img> 补上统一 class，保证样式与缩放生效 */
            function normalizeEditorImages(editor) {
                editor.querySelectorAll('img').forEach(im => {
                    if (!im.classList.contains('qa-img')) im.classList.add('qa-img');
                    if (!im.getAttribute('alt')) im.setAttribute('alt', '');
                    // 显式声明可拖拽，避免个别浏览器/场景下拖不动
                    if (im.getAttribute('draggable') !== 'true') im.setAttribute('draggable', 'true');
                    // 图片解码完成才有真实高度，届时重算容器高度（自由定位图片不占位）
                    if (!im.dataset.qaInit) {
                        im.dataset.qaInit = '1';
                        im.addEventListener('load', function() {
                            const host = im.closest && im.closest('[contenteditable="true"]');
                            if (host) syncFreeHeight(host);
                            if (imageUI.img === im) positionImageUI();
                        });
                    }
                });
            }

            // ============================================================
            //  【新增】图片选中浮层：四角自由缩放 + 工具条删除
            // ============================================================
            const imageUI = {
                editor: null,
                img: null,
                box: null,
                toolbar: null,
                label: null,
                slider: null,
                reposition: null
            };

            function clearImageUI() {
                if (imageUI.img && imageUI.img.classList) imageUI.img.classList.remove('img-selected');
                if (imageUI.box && imageUI.box.parentNode) imageUI.box.parentNode.removeChild(imageUI.box);
                if (imageUI.reposition) {
                    window.removeEventListener('scroll', imageUI.reposition, true);
                    window.removeEventListener('resize', imageUI.reposition);
                }
                imageUI.editor = null;
                imageUI.img = null;
                imageUI.box = null;
                imageUI.toolbar = null;
                imageUI.label = null;
                imageUI.slider = null;
                imageUI.reposition = null;
            }

            function editorInnerWidth(editor) {
                const w = editor.clientWidth - 28; // 减去左右 padding
                return w > 40 ? w : 300;
            }

            function updateSizeLabel() {
                if (!imageUI.img || !imageUI.editor || !imageUI.label) return;
                const rect = imageUI.img.getBoundingClientRect();
                const pct = Math.max(1, Math.round(rect.width / editorInnerWidth(imageUI.editor) * 100));
                imageUI.label.textContent = `${pct}% · ${Math.round(rect.width)}px`;
                if (imageUI.slider) imageUI.slider.value = Math.min(100, Math.max(5, pct));
            }

            /** 高亮当前生效的排版模式 */
            function updateLayoutButtons() {
                if (!imageUI.toolbar || !imageUI.img) return;
                IMG_LAYOUTS.forEach(l => {
                    const b = imageUI.toolbar.querySelector('[data-act="' + l.act + '"]');
                    if (b) b.classList.toggle('active', imageUI.img.classList.contains(l.cls));
                });
                const freeBtn = imageUI.toolbar.querySelector('[data-act="free"]');
                if (freeBtn) {
                    const isFree = isFreeImage(imageUI.img);
                    freeBtn.classList.toggle('active', isFree);
                    freeBtn.innerHTML = isFree ? ICON.inline : ICON.free;
                    freeBtn.title = isFree ? '回归文档流（取消自由定位）' : '自由拖拽：解锁后可拖到任意位置';
                }
            }

            function positionImageUI() {
                if (!imageUI.img || !imageUI.box) return;
                if (!imageUI.img.isConnected) { clearImageUI(); return; }
                updateLayoutButtons();
                const r = imageUI.img.getBoundingClientRect();
                const box = imageUI.box;
                box.style.left = (r.left + window.scrollX) + 'px';
                box.style.top = (r.top + window.scrollY) + 'px';
                box.style.width = r.width + 'px';
                box.style.height = r.height + 'px';
                if (imageUI.toolbar) {
                    imageUI.toolbar.style.top = (r.top > 56 ? -44 : r.height + 8) + 'px';
                    // 图片靠右时把工具条往左推，避免溢出视口
                    imageUI.toolbar.style.left = '0px';
                    const tw = imageUI.toolbar.offsetWidth;
                    if (tw) {
                        const overflow = (r.left + tw) - (window.innerWidth - 8);
                        if (overflow > 0) imageUI.toolbar.style.left = (-overflow) + 'px';
                    }
                }
                updateSizeLabel();
            }

            function setImageWidth(px) {
                if (!imageUI.img) return;
                const w = Math.max(40, Math.min(4000, Math.round(px)));
                imageUI.img.style.width = w + 'px';
                imageUI.img.style.height = 'auto';
                positionImageUI();
                saveFreeLayout(imageUI.img, imageUI.editor);   // 改了尺寸，相对宽高也要跟着变
                syncFreeHeight(imageUI.editor);
            }

            function setImagePercent(pct) {
                if (!imageUI.img) return;
                imageUI.img.style.width = Math.max(5, Math.min(100, pct)) + '%';
                imageUI.img.style.height = 'auto';
                positionImageUI();
                saveFreeLayout(imageUI.img, imageUI.editor);
                syncFreeHeight(imageUI.editor);
            }

            function showImageUI(editor, img) {
                clearImageUI();
                img.classList.add('img-selected');
                imageUI.editor = editor;
                imageUI.img = img;

                const box = document.createElement('div');
                box.className = 'img-resize-box';

                const toolbar = document.createElement('div');
                toolbar.className = 'img-toolbar';
                toolbar.innerHTML =
                    `<span class="img-size-label">100%</span>
                     <input type="range" min="5" max="100" step="1" value="100" title="拖动缩放">
                     <button type="button" class="img-tb-btn img-tb-free" data-act="free" title="自由拖拽：解锁后可拖到任意位置">${ICON.free}</button>
                     <span class="img-tb-sep"></span>
                     ${IMG_LAYOUTS.map(l => `<button type="button" class="img-tb-btn" data-act="${l.act}" title="${l.title}">${ICON[l.icon]}</button>`).join('')}
                     <button type="button" class="img-tb-btn" data-act="origin" title="原始尺寸"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.2V2.2h4M14 9.8v4h-4M14 6.2v-4h-4M2 9.8v4h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                     <button type="button" class="img-tb-btn img-tb-del" data-act="del" title="删除图片"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.6h10.8M6 4.6V2.9h4v1.7M4.1 4.6l.8 8.5h6.2l.8-8.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
                box.appendChild(toolbar);

                ['nw', 'ne', 'se', 'sw'].forEach(pos => {
                    const h = document.createElement('div');
                    h.className = 'img-resize-handle ' + pos;
                    h.dataset.pos = pos;
                    h.addEventListener('pointerdown', startResizeDrag);
                    box.appendChild(h);
                });

                document.body.appendChild(box);
                imageUI.box = box;
                imageUI.toolbar = toolbar;
                imageUI.label = toolbar.querySelector('.img-size-label');
                imageUI.slider = toolbar.querySelector('input[type="range"]');

                // 工具条交互（mousedown 阻止默认，避免编辑器失焦丢选区）
                toolbar.addEventListener('mousedown', e => e.preventDefault());
                toolbar.addEventListener('input', function(e) {
                    if (e.target === imageUI.slider) setImagePercent(parseInt(imageUI.slider.value, 10));
                });
                toolbar.addEventListener('click', function(e) {
                    const btn = e.target.closest('[data-act]');
                    if (!btn) return;
                    const act = btn.dataset.act;
                    if (act === 'del') {
                        const target = imageUI.img;
                        const host = imageUI.editor;
                        clearImageUI();
                        if (target && target.parentNode) target.parentNode.removeChild(target);
                        syncFreeHeight(host);
                    } else if (act === 'fit') {
                        setImagePercent(100);
                    } else if (act === 'origin') {
                        imageUI.img.style.width = '';
                        imageUI.img.style.height = '';
                        positionImageUI();
                    } else if (act === 'free') {
                        // 自由漫游 ⇄ 回归文档流
                        toggleImageFree(imageUI.img, imageUI.editor);
                        updateLayoutButtons();
                        positionImageUI();
                    } else {
                        // 排版模式：图左文右 / 图右文左 / 独占一行居中 / 靠左
                        applyImageLayout(imageUI.img, act);
                        updateLayoutButtons();
                        positionImageUI();
                    }
                });

                imageUI.reposition = function() { positionImageUI(); };
                window.addEventListener('scroll', imageUI.reposition, true);
                window.addEventListener('resize', imageUI.reposition);

                positionImageUI();
            }

            function startResizeDrag(e) {
                e.preventDefault();
                e.stopPropagation();
                const img = imageUI.img;
                if (!img) return;

                const pos = e.currentTarget.dataset.pos;
                const dirX = (pos === 'ne' || pos === 'se') ? 1 : -1;
                const startX = e.clientX;
                const startW = img.getBoundingClientRect().width;
                const handle = e.currentTarget;
                try { handle.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }

                const onMove = ev => {
                    setImageWidth(startW + (ev.clientX - startX) * dirX);
                };
                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
            }

            // ============================================================
            //  【新增】图片拖拽换位（编辑器内自由调整顺序 / 跨编辑器拖动）
            // ============================================================
            let draggingImage = null;
            let dropIndicator = null;
            let dropRange = null;      // 精确落点（可落在文字中间）
            let dropRefNode = null;    // 退化到块级落点

            function hideDropIndicator() {
                if (dropIndicator) dropIndicator.style.display = 'none';
                dropRange = null;
                dropRefNode = null;
            }

            /**
             * 用光标命中测试拿到精确插入点 —— 这是「自由摆放」的关键：
             * 落点可以是一段文字的中间，而不只是段落与段落之间。
             */
            function computeDropRange(editor, x, y) {
                let range = null;
                if (document.caretRangeFromPoint) {
                    range = document.caretRangeFromPoint(x, y);
                } else if (document.caretPositionFromPoint) {
                    const pos = document.caretPositionFromPoint(x, y);
                    if (pos) {
                        range = document.createRange();
                        try {
                            range.setStart(pos.offsetNode, pos.offset);
                            range.collapse(true);
                        } catch (e) {
                            range = null;
                        }
                    }
                }
                if (range && editor.contains(range.startContainer)) return range;
                return null;
            }

            /** 拿不到精确光标时的兜底：块级子节点边界（null = 末尾） */
            function computeDropRef(editor, y) {
                const kids = Array.from(editor.children);
                for (let i = 0; i < kids.length; i++) {
                    const kid = kids[i];
                    if (kid === draggingImage) continue;
                    const r = kid.getBoundingClientRect();
                    if (y < r.top + r.height / 2) return kid;
                }
                return null;
            }

            function showDropIndicator(editor, x, y) {
                dropRange = computeDropRange(editor, x, y);
                dropRefNode = dropRange ? null : computeDropRef(editor, y);
                if (!dropIndicator) {
                    dropIndicator = document.createElement('div');
                    dropIndicator.className = 'img-drop-indicator';
                    dropIndicator.style.display = 'none';
                    document.body.appendChild(dropIndicator);
                }
                const er = editor.getBoundingClientRect();
                let top = null;

                if (dropRange) {
                    const r = dropRange.getBoundingClientRect();
                    if (r && (r.height > 0 || r.top > 0)) {
                        top = r.top;
                    } else {
                        const n = dropRange.startContainer;
                        const el = n.nodeType === 1 ? n : n.parentNode;
                        top = el.getBoundingClientRect().top;
                    }
                }

                if (top === null) {
                    if (dropRefNode) {
                        top = dropRefNode.getBoundingClientRect().top;
                    } else {
                        const kids = editor.children;
                        if (kids.length) {
                            const last = kids[kids.length - 1];
                            top = (last === draggingImage && kids.length > 1)
                                ? kids[kids.length - 2].getBoundingClientRect().bottom
                                : last.getBoundingClientRect().bottom;
                        } else {
                            top = er.top + 12;
                        }
                    }
                }

                dropIndicator.style.left = (er.left + window.scrollX + 4) + 'px';
                dropIndicator.style.top = (top + window.scrollY - 1) + 'px';
                dropIndicator.style.width = Math.max(60, er.width - 32) + 'px';
                dropIndicator.style.display = 'block';
            }

            /** 块级兜底：插到 refNode 之前或末尾 */
            function moveImageInto(editor, img, refNode, oldParent) {
                if (!img || !editor) return;
                if (refNode && refNode.parentNode === editor) {
                    editor.insertBefore(img, refNode);
                } else {
                    editor.appendChild(img);
                }
            }

            /** 搬走后清理：原容器空了就删掉；编辑器空了补一个空段落 */
            function cleanupAfterMove(editor, oldParent) {
                if (oldParent && oldParent !== editor && oldParent.parentNode) {
                    if (!oldParent.querySelector('img') && !(oldParent.textContent || '').trim()) {
                        oldParent.parentNode.removeChild(oldParent);
                    }
                }
                if (!editor.querySelector('img') && !(editor.textContent || '').trim()) {
                    editor.innerHTML = '<p><br></p>';
                }
            }

            function endImageDrag() {
                if (draggingImage && draggingImage.classList) draggingImage.classList.remove('img-dragging');
                draggingImage = null;
                hideDropIndicator();
            }

            document.addEventListener('dragend', endImageDrag);

            // 点击空白/其他位置收起浮层
            document.addEventListener('mousedown', function(e) {

            function openLightbox(src) {
                let lb = document.getElementById('imgLightbox');
                if (!lb) {
                    lb = document.createElement('div');
                    lb.id = 'imgLightbox';
                    lb.className = 'img-lightbox';
                    lb.innerHTML =

                         <img alt="预览">

                    lb.addEventListener('click', closeLightbox);
                    document.body.appendChild(lb);
                }
                lb.querySelector('img').src = src;
                lb.classList.add('visible');
            }

            function closeLightbox() {
                const lb = document.getElementById('imgLightbox');
                if (lb) lb.classList.remove('visible');
            }

            /** quiet=true 时只落盘、不排自动推送（用于同步内部的中间保存） */
            function saveData(quiet) {
                try {
                    localStorage.setItem('qaData', JSON.stringify(qaData));
                    localStorage.setItem('categories', JSON.stringify(categories));
                    localStorage.setItem('nextId', String(nextId));
                    localStorage.setItem('lastEditTime', JSON.stringify(lastEditTime));
                    if (!quiet) scheduleAutoPush();     // 开了自动同步就顺手推上去（内部有 4 秒防抖）

                } catch (e) {
                    console.warn('保存失败:', e);

                        quotaWarned = true;
                        alert('⚠️ 本地存储空间不足，本次修改可能未保存。\n图片会占用较多空间，建议删掉部分图片或先用「导出缓存」备份后清理。');

                        const time = localStorage.getItem('lastEditTime');
                        if (time) lastEditTime = new Date(JSON.parse(time));
                        return true;

                } catch (e) {
                    console.warn('加载失败:', e);
                }
                return false;
            }

            /** 应用主题：切 html[data-theme]，并同步按钮文案与图标 */

                }
                savePrefs();
            }

            function toggleTheme() {
                applyTheme(theme === 'dark' ? 'light' : 'dark');

            // ============================================================

            function initData() {
                const hasData = loadData();
                if (!hasData || qaData.length === 0) {
                    qaData = getSampleData();
                    const cats = new Set(qaData.map(item => item.category));
                    categories = ['全部', ...Array.from(cats)];
                    // 起始 id 必须大于示例数据的最大 id，否则新条目会撞号
                    nextId = qaData.reduce((m, i) => Math.max(m, parseInt(i.id, 10) || 0), 0) + 1;
                    lastEditTime = new Date();
                    saveData();
                }
                updateLastSaved();
            }

            // ============================================================
            //  分类管理
            // ============================================================
            function editCategory(oldName, newName) {
                if (oldName === '全部') { alert('不能编辑"全部"分类'); return; }
                if (!newName || newName.trim() === '') { alert('分类名称不能为空'); return; }
                newName = newName.trim();
                if (categories.includes(newName) && newName !== oldName) {
                    alert('分类名称已存在');
                    return;
                }
                const index = categories.indexOf(oldName);
                if (index > -1) categories[index] = newName;
                qaData.forEach(item => {
                    if (item.category === oldName) item.category = newName;
                });
                if (currentCategory === oldName) currentCategory = newName;
                lastEditTime = new Date();
                updateLastSaved();
                saveData();
                renderAll();
            }

            function deleteCategory(catName) {
                if (catName === '全部' || catName === '默认') {
                    alert('不能删除系统分类');
                    return;
                }
                if (!confirm(`确定删除分类“${catName}”吗？该分类下的问答将移到"默认"分类。`)) return;
                categories = categories.filter(c => c !== catName);
                qaData.forEach(item => {
                    if (item.category === catName) item.category = '默认';
                });
                if (currentCategory === catName) currentCategory = '全部';
                if (!categories.includes('默认')) categories.push('默认');
                lastEditTime = new Date();
                updateLastSaved();
                saveData();
                renderAll();

                list: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.4 4h11.2M2.4 8h11.2M2.4 12h11.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',

                install: '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" style="vertical-align:-3px;"><rect x="4.4" y="1.6" width="7.2" height="12.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 12.4h2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'
            };

            // 图片排版模式：class 名 ↔ 工具条按钮
            const IMG_LAYOUTS = [
                { cls: 'qa-img-float-left', act: 'float-left', icon: 'layFL', title: '图左文右（文字环绕）' },
                { cls: 'qa-img-float-right', act: 'float-right', icon: 'layFR', title: '图右文左（文字环绕）' },
                { cls: 'qa-img-block-center', act: 'block-center', icon: 'layBC', title: '独占一行，居中' },
                { cls: 'qa-img-block-left', act: 'block-left', icon: 'layBL', title: '独占一行，靠左' },
            ];

            function applyImageLayout(img, act) {
                if (!img) return;
                IMG_LAYOUTS.forEach(l => img.classList.remove(l.cls));
                const target = IMG_LAYOUTS.find(l => l.act === act);
                if (target) img.classList.add(target.cls);
            }

            // ============================================================
            //  【自由漫游】图片脱离文档流，可拖到画布任意坐标
            //  · 坐标写进 style="left/top"，随 HTML 一起保存，阅读态原样还原
            //  · 拖动用 pointer 事件实时跟随，图片跟手走，松手即落定
            // ============================================================
            let freeZ = 1;
            // 记录进入自由模式前在文档流中的位置，「回归文档流」时放回原处（不写进 HTML）
            const freeOrigin = new WeakMap();

            function isFreeImage(img) {
                return !!(img && img.classList && img.classList.contains('qa-img-free'));
            }

            /** 视口坐标 → 容器内容坐标（考虑边框与滚动） */
            function toLocalPoint(container, clientX, clientY) {
                const r = container.getBoundingClientRect();
                return {
                    x: clientX - r.left - (container.clientLeft || 0) + (container.scrollLeft || 0),
                    y: clientY - r.top - (container.clientTop || 0) + (container.scrollTop || 0)
                };
            }

            /**
             * 绝对定位的图片不占高度，容器必须手动撑开，
             * 否则图片会溢出到容器外、被下面的内容盖住。
             */
            function syncFreeHeight(container) {
                if (!container) return;
                const frees = container.querySelectorAll('img.qa-img-free');
                if (!frees.length) {
                    container.style.minHeight = '';
                    return;
                }
                let bottom = 0;
                frees.forEach(im => {
                    const top = parseFloat(im.style.top) || 0;
                    const h = im.offsetHeight || parseFloat(im.style.height) || 0;
                    if (top + h > bottom) bottom = top + h;
                });
                container.style.minHeight = Math.round(bottom + 16) + 'px';
            }

            // ============================================================
            //  【跨设备还原】自由图片的「相对坐标」
            //  问题：left / top / width 原本是纯像素。电脑上容器 800px 宽摆好的图
            //        （比如 left:620px），到手机上容器只剩 360px —— 图片直接跑到屏幕外，
            //        表现就是「同样的照片，手机端看不到」。
            //  做法：额外把 left / top / width 记成「相对容器宽度的百分比」
            //        （data-fx / data-fy / data-fw，跟着 HTML 一起存），
            //        渲染时按当前容器宽度换算回像素；拖动 / 缩放 / 解锁后再回写百分比。
            //  纵向也用宽度做基准 —— 容器高度会随文字重排变化，用高度百分比会让图乱飘。
            // ============================================================
            function freeBoxWidth(container) {
                return container.clientWidth || container.offsetWidth || 0;
            }

            /** 用当前像素坐标反算百分比写进 data（解锁 / 拖动结束 / 缩放后都要调） */
            function saveFreeLayout(img, container) {
                if (!img || !container || !isFreeImage(img)) return;
                const w = freeBoxWidth(container);
                if (!w) return;
                const left = parseFloat(img.style.left) || 0;
                const top = parseFloat(img.style.top) || 0;
                const iw = img.getBoundingClientRect().width ||
                           img.offsetWidth || parseFloat(img.style.width) || 0;
                if (!iw) return;
                img.dataset.fx = (left / w * 100).toFixed(2);
                img.dataset.fy = (top / w * 100).toFixed(2);
                img.dataset.fw = (iw / w * 100).toFixed(2);
            }

            /**
             * 抢救老数据：改造前存的图片只有像素坐标（left 可能是 620px 这种按电脑宽屏算的值），
             * 直接按手机容器补算百分比会把错误坐标永久固化。
             * 判据：图片的右边界超出容器 → 说明它是按更宽的屏幕摆的 → 整块等比压进容器，
             * 保住「靠左还是靠右」的相对位置，再补算百分比。用户之后重新拖一下就彻底修好。
             */
            function adoptLegacyFreeImage(img, container) {
                const w = freeBoxWidth(container);
                if (!w) return;
                let left = parseFloat(img.style.left) || 0;
                let top = parseFloat(img.style.top) || 0;
                let iw = img.getBoundingClientRect().width ||
                         img.offsetWidth || parseFloat(img.style.width) || 0;
                if (!iw) return;                 // 图片还没解码，等 load 再补算
                const right = left + iw;
                if (right > w + 2) {
                    const scale = w / right;
                    left *= scale;
                    top *= scale;
                    iw *= scale;
                    img.style.left = Math.round(left) + 'px';
                    img.style.top = Math.round(top) + 'px';
                    img.style.width = Math.round(iw) + 'px';
                    img.style.height = 'auto';
                }
                saveFreeLayout(img, container);
            }

            /** 按当前容器宽度还原像素坐标；老数据（没有 data 属性）先抢救再补算 */
            function applyFreeLayout(container) {
                if (!container) return;
                const w = freeBoxWidth(container);
                if (!w) return;
                container.querySelectorAll('img.qa-img-free').forEach(function (img) {
                    const fx = parseFloat(img.dataset.fx);
                    const fy = parseFloat(img.dataset.fy);
                    const fw = parseFloat(img.dataset.fw);
                    if (isNaN(fx) || isNaN(fy) || isNaN(fw)) {
                        adoptLegacyFreeImage(img, container);
                        return;
                    }
                    img.style.left = Math.round(fx / 100 * w) + 'px';
                    img.style.top = Math.round(fy / 100 * w) + 'px';
                    img.style.width = Math.round(fw / 100 * w) + 'px';
                    img.style.height = 'auto';
                });
                syncFreeHeight(container);
            }

            /** 窗口缩放 / 手机横竖屏切换 → 所有自由图片按新宽度重排 */
            function relayoutAllFreeImages() {
                // .free-layer 是阅读态定位容器；.qa-answer-editor 是编辑区（新增 / 行内编辑）
                document.querySelectorAll('.free-layer, .qa-answer-editor').forEach(applyFreeLayout);
            }

            /** 解锁：图片变成浮在画布上的贴纸 */
            function makeImageFree(img, container) {
                if (!img || !container || isFreeImage(img)) return;
                const origin = { parent: img.parentNode, next: img.nextSibling };
                const r = img.getBoundingClientRect();
                const p = toLocalPoint(container, r.left, r.top);

                IMG_LAYOUTS.forEach(l => img.classList.remove(l.cls));
                img.classList.add('qa-img-free');
                img.style.position = 'absolute';
                img.style.left = Math.round(p.x) + 'px';
                img.style.top = Math.round(p.y) + 'px';
                img.style.zIndex = String(++freeZ);
                img.style.float = 'none';
                img.style.display = 'block';
                img.style.margin = '0';
                // 绝对定位下百分比宽度会变成相对容器算，先固化成像素，避免解锁瞬间跳尺寸
                if (img.style.width && img.style.width.indexOf('%') > -1) {
                    img.style.width = Math.round(r.width) + 'px';
                }
                freeOrigin.set(img, origin);
                saveFreeLayout(img, container);   // 记下相对坐标，换设备才能还原
                syncFreeHeight(container);
            }

            /** 锁定：回到文档流原位 */
            function makeImageInline(img, container) {
                if (!img || !container || !isFreeImage(img)) return;
                img.classList.remove('qa-img-free');
                ['position', 'left', 'top', 'zIndex', 'float', 'display', 'margin'].forEach(k => {
                    img.style[k] = '';
                });
                // 回到文档流后相对坐标就没意义了，清掉免得下次误用
                ['fx', 'fy', 'fw'].forEach(k => { if (img.dataset) delete img.dataset[k]; });
                const o = freeOrigin.get(img);
                freeOrigin.delete(img);

                let placed = false;
                // 优先落到当前光标处：先把光标点进目标段落，再点「回归文档流」，图就到那儿
                const sel = window.getSelection && window.getSelection();
                if (sel && sel.rangeCount) {
                    const range = sel.getRangeAt(0);
                    if (range.startContainer && container.contains(range.startContainer) &&
                        range.startContainer !== img) {
                        try {
                            range.insertNode(img);
                            placed = true;
                        } catch (e) {
                            placed = false;
                        }
                    }
                }
                if (!placed) {
                    if (o && o.parent && o.parent.isConnected) {
                        if (o.next && o.next.parentNode === o.parent) o.parent.insertBefore(img, o.next);
                        else o.parent.appendChild(img);
                    } else {
                        container.appendChild(img);
                    }
                }
                syncFreeHeight(container);
            }

            function toggleImageFree(img, container) {
                if (!img || !container) return;
                if (isFreeImage(img)) makeImageInline(img, container);
                else makeImageFree(img, container);
            }

            /**
             * 拖动图片：一拖就解锁成自由模式并实时跟手 —— 不用先点按钮
             * 移动不足 3px 视为点击（只选中，不改变布局），避免手抖把图甩出去
             */
            function startFreeDrag(e, container, img) {
                if (typeof e.button === 'number' && e.button !== 0) return;
                if (e.target && e.target.closest && e.target.closest('.img-resize-handle')) return;
                e.preventDefault();

                const rect0 = img.getBoundingClientRect();
                const imgPos = toLocalPoint(container, rect0.left, rect0.top);
                const grab = toLocalPoint(container, e.clientX, e.clientY);
                const offX = grab.x - imgPos.x;   // 鼠标相对图片左上角的抓取偏移
                const offY = grab.y - imgPos.y;
                const startX = e.clientX;
                const startY = e.clientY;
                let moved = false;

                const onMove = ev => {
                    if (!moved) {
                        if (Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) < 3) return;
                        moved = true;
                        // 首次真正移动时才解锁，保证「原地点击」不会改变布局
                        if (!isFreeImage(img)) makeImageFree(img, container);
                        img.style.zIndex = String(++freeZ);
                        img.classList.add('img-free-moving');
                    }
                    const p = toLocalPoint(container, ev.clientX, ev.clientY);
                    const maxX = Math.max(0, container.clientWidth - img.offsetWidth);
                    const x = Math.max(0, Math.min(p.x - offX, maxX));
                    const y = Math.max(0, p.y - offY);
                    img.style.left = Math.round(x) + 'px';
                    img.style.top = Math.round(y) + 'px';
                    syncFreeHeight(container);
                    if (imageUI.img === img) positionImageUI();
                };

                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    img.classList.remove('img-free-moving');
                    saveFreeLayout(img, container);   // 落定后回写相对坐标
                    syncFreeHeight(container);
                    showImageUI(container, img);
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
            }

            // —— 工具栏模板：新增问答 与 行内编辑 共用这一份 ——
            const EDITOR_TOOLBAR_HTML =
                `<select class="qa-font-family" title="字体"></select>
                 <select class="qa-font-size" title="字号"></select>
                 <span class="separator"></span>
                 <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
                 <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
                 <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
                 <span class="separator"></span>
                 <input type="color" class="qa-color" value="#1d3857" title="文字颜色">
                 <span class="separator"></span>
                 <button type="button" data-act="image" title="插入图片：可一次选多张，也可直接粘贴或把图片拖进来；按住图片拖动即可自由摆放">${ICON.image}<span class="btn-label">图片</span></button>
                 <span class="separator"></span>
                 <button type="button" data-cmd="insertUnorderedList" title="无序列表">${ICON.listUl}<span class="btn-label">列表</span></button>
                 <button type="button" data-cmd="insertOrderedList" title="有序列表">${ICON.listOl}<span class="btn-label">编号</span></button>
                 <span class="separator"></span>
                 <button type="button" data-cmd="indent" title="增加缩进">${ICON.indent}<span class="btn-label">缩进</span></button>
                 <button type="button" data-cmd="outdent" title="减少缩进">${ICON.outdent}<span class="btn-label">退缩进</span></button>
                 <span class="separator"></span>
                 <button type="button" data-cmd="removeFormat" title="清除格式">${ICON.eraser}<span class="btn-label">清除</span></button>`;

            const FONT_FAMILIES = [
                { label: '字体', value: '' },
                { label: '默认', value: 'inherit' },
                { label: '微软雅黑', value: 'Microsoft YaHei, 微软雅黑, sans-serif' },
                { label: '宋体', value: 'SimSun, 宋体, serif' },
                { label: '黑体', value: 'SimHei, 黑体, sans-serif' },
                { label: '楷体', value: 'KaiTi, STKaiti, 楷体, serif' },
                { label: '仿宋', value: 'FangSong, STFangsong, 仿宋, serif' },
                { label: '等线', value: 'DengXian, 等线, sans-serif' },
                { label: 'Arial', value: 'Arial, Helvetica, sans-serif' },
                { label: 'Times', value: 'Times New Roman, Times, serif' },
                { label: '等宽', value: 'Consolas, Monaco, monospace' },
            ];

            const FONT_SIZES = [12, 14, 16, 18, 20, 24, 28, 32, 36, 48];

            function buildToolbar(toolbar) {
                toolbar.innerHTML = EDITOR_TOOLBAR_HTML;
                const fam = toolbar.querySelector('.qa-font-family');
                FONT_FAMILIES.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.value;
                    opt.textContent = f.label;
                    if (f.value && f.value !== 'inherit') opt.style.fontFamily = f.value;
                    fam.appendChild(opt);
                });
                const size = toolbar.querySelector('.qa-font-size');
                const ph = document.createElement('option');
                ph.value = '';
                ph.textContent = '字号';
                size.appendChild(ph);
                FONT_SIZES.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s + 'px';
                    opt.textContent = String(s);
                    opt.style.fontSize = s + 'px';
                    size.appendChild(opt);
                });
            }

            function execEditorCommand(editor, cmd, value) {
                editor.focus();
                document.execCommand(cmd, false, value || null);
            }

            /**
             * 有选区时直接包一层 span 写内联样式：
             * 比 execCommand('fontSize'/'fontName') 可靠（后者在部分浏览器只认 1~7 / font face），
             * 且产出干净的 style="font-size:16px"。无选区时回退到 execCommand，作用于后续输入。
             */
            function applyInlineStyle(editor, prop, cssValue) {
                editor.focus();
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return false;
                const range = sel.getRangeAt(0);
                if (range.collapsed || !editor.contains(range.commonAncestorContainer)) return false;
                try {
                    const span = document.createElement('span');
                    span.style.setProperty(prop, cssValue);
                    span.appendChild(range.extractContents());
                    range.insertNode(span);
                    const r2 = document.createRange();
                    r2.selectNodeContents(span);
                    sel.removeAllRanges();
                    sel.addRange(r2);
                    return true;
                } catch (e) {
                    return false;
                }
            }

            function attachEditorFeatures(editor, toolbar) {
                // —— 文本命令 ——
                toolbar.querySelectorAll('[data-cmd]').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        execEditorCommand(editor, this.dataset.cmd);
                    });
                });

                // —— 字体族 ——
                const fontFamilySel = toolbar.querySelector('.qa-font-family');
                if (fontFamilySel) {
                    fontFamilySel.addEventListener('change', function() {
                        const v = this.value;
                        this.value = '';
                        if (!v) return;
                        if (!applyInlineStyle(editor, 'font-family', v)) {
                            execEditorCommand(editor, 'fontName', v);
                        }
                    });
                }

                // —— 字号（具体 px）——
                const fontSizeSel = toolbar.querySelector('.qa-font-size');
                if (fontSizeSel) {
                    fontSizeSel.addEventListener('change', function() {
                        const v = this.value;
                        this.value = '';
                        if (!v) return;
                        if (!applyInlineStyle(editor, 'font-size', v)) {
                            execEditorCommand(editor, 'fontSize', v);
                        }
                    });
                }

                const colorInput = toolbar.querySelector('input[type="color"]');
                if (colorInput) {
                    colorInput.addEventListener('input', function() {
                        execEditorCommand(editor, 'foreColor', this.value);
                    });
                }

                // —— 插入图片 ——
                const imgBtn = toolbar.querySelector('[data-act="image"]');
                if (imgBtn) {
                    imgBtn.addEventListener('mousedown', function(e) {
                        e.preventDefault(); // 保住编辑器焦点和光标
                        saveCaret(editor);
                    });
                    imgBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        saveCaret(editor);
                        pickImages(editor);
                    });
                }

                // —— 键盘 ——
                editor.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        document.execCommand('insertParagraph', false, null);
                        e.preventDefault();
                        return;
                    }
                    if (e.key === 'Escape') { clearImageUI(); return; }
                    if ((e.key === 'Delete' || e.key === 'Backspace') &&
                        imageUI.img && imageUI.editor === editor && imageUI.img.isConnected) {
                        e.preventDefault();
                        const target = imageUI.img;
                        clearImageUI();
                        if (target.parentNode) target.parentNode.removeChild(target);
                        syncFreeHeight(editor);
                    }
                });

                // —— 光标记录 ——
                editor.addEventListener('blur', function() { saveCaret(editor); });
                editor.addEventListener('mouseup', function() { saveCaret(editor); });
                editor.addEventListener('keyup', function() { saveCaret(editor); });

                // —— 图片漫游：按住拖动即可自由摆放（未解锁的图一拖自动解锁）——
                editor.addEventListener('pointerdown', function(e) {
                    if (e.target && e.target.tagName === 'IMG' && e.target.classList.contains('qa-img')) {
                        startFreeDrag(e, editor, e.target);
                    }
                });

                // —— 点击图片 → 显示缩放浮层 ——
                editor.addEventListener('click', function(e) {
                    if (e.target.tagName === 'IMG') {
                        showImageUI(editor, e.target);
                    } else if (imageUI.img && imageUI.editor === editor) {
                        clearImageUI();
                    }
                });

                // —— 粘贴图片 ——
                editor.addEventListener('paste', function(e) {
                    const items = e.clipboardData && e.clipboardData.items;
                    if (!items) return;
                    const files = [];
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type && items[i].type.indexOf('image/') === 0) {
                            const f = items[i].getAsFile();
                            if (f) files.push(f);
                        }
                    }
                    if (files.length) {
                        e.preventDefault();
                        saveCaret(editor);
                        insertImageFiles(editor, files);
                    } else {
                        setTimeout(() => normalizeEditorImages(editor), 0);
                    }
                });

                // —— 拖拽：内部图片换位 / 外部图片插入 ——
                editor.addEventListener('dragstart', function(e) {
                    if (e.target && e.target.tagName === 'IMG') {
                        // 自由模式的图片走 pointer 拖拽，别让浏览器原生 drag 插一脚
                        if (isFreeImage(e.target)) {
                            e.preventDefault();
                            return;
                        }
                        clearImageUI();
                        draggingImage = e.target;
                        draggingImage.classList.add('img-dragging');
                        if (e.dataTransfer) {
                            e.dataTransfer.effectAllowed = 'move';
                            try { e.dataTransfer.setData('text/plain', 'qa-image-move'); } catch (err) { /* 忽略 */ }
                        }
                    } else {
                        draggingImage = null;
                    }
                });

                editor.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    if (!draggingImage) return;
                    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
                    showDropIndicator(editor, e.clientX, e.clientY);
                });

                editor.addEventListener('dragleave', function(e) {
                    if (!draggingImage) return;
                    if (!editor.contains(e.relatedTarget)) hideDropIndicator();
                });

                editor.addEventListener('drop', function(e) {
                    // ① 编辑器内部拖图片换位（优先精确到文字中间）
                    if (draggingImage) {
                        e.preventDefault();
                        e.stopPropagation();
                        const img = draggingImage;
                        const range = dropRange;
                        const ref = dropRefNode;
                        const oldParent = img.parentNode;
                        hideDropIndicator();
                        if (img.classList) img.classList.remove('img-dragging');

                        let placed = false;
                        if (range && editor.contains(range.startContainer)) {
                            try {
                                range.insertNode(img);
                                placed = true;
                            } catch (err) {
                                placed = false;
                            }
                        }
                        if (!placed) moveImageInto(editor, img, ref, oldParent);
                        cleanupAfterMove(editor, oldParent);

                        draggingImage = null;
                        showImageUI(editor, img);
                        return;
                    }

                    // ② 外部拖入图片文件 / 图片链接
                    const dt = e.dataTransfer;
                    if (!dt) return;
                    let files = Array.from(dt.files || []);
                    if (files.length === 0) {
                        const url = dt.getData('text/uri-list') || dt.getData('text/plain');
                        if (url && /^https?:\/\//i.test(url.trim())) {
                            e.preventDefault();
                            restoreCaret(editor);
                            document.execCommand('insertHTML', false,
                                `<img class="qa-img" src="${escapeHtml(url.trim())}" alt="" draggable="true"><p><br></p>`);
                            normalizeEditorImages(editor);
                            return;
                        }
                    }
                    const imgFiles = files.filter(f => f && f.type && f.type.indexOf('image/') === 0);
                    if (imgFiles.length) {
                        e.preventDefault();
                        saveCaret(editor);
                        insertImageFiles(editor, imgFiles);
                    }
                });

                editor.addEventListener('scroll', positionImageUI);
                editor.addEventListener('input', function() {
                    if (imageUI.img && !imageUI.img.isConnected) clearImageUI();
                });
            }

            function setupEditorToolbar() {
                const toolbar = document.getElementById('editorToolbar');
                buildToolbar(toolbar);
                attachEditorFeatures(newAnswerEditor, toolbar);

                newAnswerEditor.addEventListener('focus', function() {
                    if (this.innerHTML === '<p><br></p>' || this.innerText.trim() === '') {
                        this.innerHTML = '';
                    }
                });
            }

            // ============================================================
            //  渲染函数
            // ============================================================
            function populateCategorySelect() {
                const currentVal = newCategorySelect.value;
                newCategorySelect.innerHTML = '';
                categories.forEach(cat => {
                    if (cat === '全部') return;
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    newCategorySelect.appendChild(opt);
                });
                if (categories.includes(currentVal) && currentVal !== '全部') {
                    newCategorySelect.value = currentVal;
                } else {
                    newCategorySelect.value = categories.length > 1 ? categories[1] : '默认';
                }
            }

            function getFilteredData() {
                let filtered = qaData;
                if (currentCategory !== '全部') {
                    filtered = filtered.filter(item => item.category === currentCategory);
                }
                if (currentImportance !== '全部') {
                    filtered = filtered.filter(item => item.importance === currentImportance);
                }
                if (searchKeyword.trim() !== '') {
                    const kw = searchKeyword.trim().toLowerCase();
                    filtered = filtered.filter(item => {
                        const qText = stripHtml(item.question);
                        const aText = stripHtml(item.answer);
                        return qText.toLowerCase().includes(kw) || aText.toLowerCase().includes(kw);
                    });
                }
                return filtered;
            }

            function refreshCategories() {
                const cats = new Set(qaData.map(item => item.category));
                let newCats = ['全部', ...Array.from(cats)];
                if (newCats.length === 1) newCats.push('默认');
                categories = newCats;
                if (!categories.includes(currentCategory) && currentCategory !== '全部') {
                    currentCategory = '全部';
                }
            }

            function renderImportanceTabs() {
                const fragment = document.createDocumentFragment();
                const impTypes = [
                    { key: '全部', label: '全部', icon: ICON.list },
                    { key: 'important', label: '重要', icon: ICON.exclaim },
                    { key: 'normal', label: '一般', icon: ICON.dot },
                    { key: 'favorite', label: '收藏', icon: ICON.star },
                ];
                impTypes.forEach(type => {
                    const tab = document.createElement('button');
                    tab.className = `imp-tab${currentImportance === type.key ? ' active' : ''}`;
                    tab.dataset.imp = type.key;
                    const count = type.key === '全部' ? qaData.length : qaData.filter(item => item.importance === type
                        .key).length;
                    tab.innerHTML =
                        `${type.icon}${type.label} <span class="badge">${count}</span>`;
                    tab.addEventListener('click', function() {
                        currentImportance = this.dataset.imp;
                        resetPage();                 // 换了筛选条件，回到第 1 页
                        renderImportanceTabs();
                        renderQaList();
                    });
                    fragment.appendChild(tab);
                });
                impTabsContainer.innerHTML = '';
                impTabsContainer.appendChild(fragment);
            }

            function renderTabs() {
                const fragment = document.createDocumentFragment();
                categories.forEach(cat => {
                    const wrapper = document.createElement('span');
                    wrapper.className = `category-wrapper${cat === currentCategory ? ' active' : ''}`;

                    const tab = document.createElement('button');
                    tab.className = 'category-tab';
                    const count = cat === '全部' ? qaData.length : qaData.filter(item => item.category === cat).length;
                    tab.innerHTML = `${cat} <span class="badge">${count}</span>`;
                    tab.addEventListener('click', function(e) {
                        e.stopPropagation();
                        currentCategory = cat;
                        resetPage();                 // 换了筛选条件，回到第 1 页
                        renderTabs();
                        renderQaList();
                    });
                    wrapper.appendChild(tab);

                    if (cat !== '全部') {
                        const editBtn = document.createElement('button');
                        editBtn.className = 'cat-edit-btn';
                        editBtn.innerHTML = ICON.pen;
                        editBtn.title = '编辑分类名称';
                        editBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const newName = prompt('请输入新的分类名称：', cat);
                            if (newName !== null && newName.trim() !== '' && newName.trim() !== cat) {
                                editCategory(cat, newName.trim());
                            } else if (newName !== null && newName.trim() === '') {
                                alert('分类名称不能为空');
                            }
                        });
                        wrapper.appendChild(editBtn);

                        if (cat !== '默认') {
                            const delBtn = document.createElement('button');
                            delBtn.className = 'cat-del-btn';
                            delBtn.innerHTML = ICON.trash;
                            delBtn.title = '删除分类';
                            delBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                deleteCategory(cat);
                            });
                            wrapper.appendChild(delBtn);
                        }
                    }

                    fragment.appendChild(wrapper);
                });

                const addCatBtn = document.createElement('button');
                addCatBtn.className = 'add-category-btn';
                addCatBtn.innerHTML = ICON.plusCircle + ' 新建分类';
                addCatBtn.addEventListener('click', function() {
                    const newCat = prompt('请输入新分类名称:');
                    if (newCat && newCat.trim() !== '' && !categories.includes(newCat.trim())) {
                        categories.push(newCat.trim());
                        currentCategory = newCat.trim();
                        resetPage();
                        renderTabs();
                        renderQaList();
                        populateCategorySelect();
                        populateBatchCategorySelect();   // 批量下拉要跟着刷新，否则新分类选不到
                        saveData();
                    } else if (newCat && categories.includes(newCat.trim())) {
                        alert('分类已存在');
                    }
                });
                fragment.appendChild(addCatBtn);

                tabsContainer.innerHTML = '';
                tabsContainer.appendChild(fragment);
            }

            function moveQaToCategory(itemId, newCategory) {
                const item = qaData.find(q => q.id === itemId);
                if (!item || item.category === newCategory) return;
                item.category = newCategory;
                item.time = formatTime(new Date());
                lastEditTime = new Date();
                updateLastSaved();
                if (!categories.includes(newCategory)) categories.push(newCategory);
                refreshCategories();
                if (!categories.includes(currentCategory) && currentCategory !== '全部') currentCategory = '全部';
                renderTabs();
                renderQaList();
                renderImportanceTabs();
                populateCategorySelect();
                populateBatchCategorySelect();
                saveData();
            }

            // ============================================================
            //  【批量选择】勾选 / 全选 / 批量改分类 / 批量导出
            // ============================================================
            function populateBatchCategorySelect() {
                const keep = batchCategorySelect.value;
                batchCategorySelect.innerHTML = '';
                const ph = document.createElement('option');
                ph.value = '';
                ph.textContent = '移动到分类…';
                batchCategorySelect.appendChild(ph);
                categories.forEach(cat => {
                    if (cat === '全部') return;
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    batchCategorySelect.appendChild(opt);
                });
                batchCategorySelect.value = (keep && categories.includes(keep)) ? keep : '';
            }

            /** 当前筛选结果（分类 + 重要性 + 搜索）的 id —— 「全选」只作用于这些 */
            function visibleIds() {
                return getFilteredData().map(i => i.id);
            }

            function updateBatchBar() {
                if (!batchBar) return;
                batchCount.textContent = String(selectedIds.size);
                const vis = visibleIds();
                const allChecked = vis.length > 0 && vis.every(id => selectedIds.has(id));
                const someChecked = vis.some(id => selectedIds.has(id));
                batchCheckAll.checked = allChecked;
                batchCheckAll.indeterminate = !allChecked && someChecked;
                batchCheckAllLabel.textContent = allChecked ? '取消全选' : '全选';
            }

            function setSelectMode(on) {
                selectMode = !!on;
                if (!selectMode) selectedIds.clear();
                batchBar.classList.toggle('hidden', !selectMode);
                batchSelectBtn.classList.toggle('btn-primary', selectMode);
                batchSelectBtn.classList.toggle('btn-outline', !selectMode);
                if (selectMode) populateBatchCategorySelect();
                updateBatchBar();
                renderQaList();
            }

            function batchChangeCategory() {
                const cat = batchCategorySelect.value;
                if (!cat) { alert('请先选择要移动到的分类'); return; }
                if (selectedIds.size === 0) { alert('还没有勾选任何问答'); return; }
                if (!confirm(`确定把选中的 ${selectedIds.size} 条问答移动到分类“${cat}”吗？`)) return;

                let changed = 0;
                qaData.forEach(item => {
                    if (selectedIds.has(item.id) && item.category !== cat) {
                        item.category = cat;
                        item.time = formatTime(new Date());
                        changed++;
                    }
                });
                if (!categories.includes(cat)) categories.push(cat);
                lastEditTime = new Date();
                updateLastSaved();
                refreshCategories();
                if (!categories.includes(currentCategory) && currentCategory !== '全部') currentCategory = '全部';
                renderAll();
                saveData();
                alert(`✅ 已把 ${changed} 条问答移动到「${cat}」`);
            }

            /** 撤销按钮的显示/隐藏（有被删条目时才出现） */
            function updateUndoBtn() {
                if (!batchUndoBtn) return;
                batchUndoBtn.classList.toggle('hidden', undoBuffer.length === 0);
            }

            /** 批量删除：删掉所有勾选的问答，并把它们暂存进 undoBuffer 以便撤销 */
            function batchDelete() {
                if (selectedIds.size === 0) { alert('请先勾选要删除的问答'); return; }

                // 按原下标收集待删条目，倒序删除，保证下标不串位
                const picked = [];
                qaData.forEach((item, idx) => { if (selectedIds.has(item.id)) picked.push({ item: item, index: idx }); });
                if (picked.length === 0) { alert('选中的条目已不在当前数据中'); return; }

                const preview = picked.slice(0, 5).map(p => '· ' + p.item.question).join('\n');
                const more = picked.length > 5 ? `\n… 以及另外 ${picked.length - 5} 条` : '';
                if (!confirm(
                    `⚠️ 确定删除选中的 ${picked.length} 条问答吗？\n\n${preview}${more}\n\n` +
                    `删完可以点「撤销删除」把它们放回去。`
                )) return;

                // 倒序 splice，下标不会互相影响
                for (let i = picked.length - 1; i >= 0; i--) qaData.splice(picked[i].index, 1);
                markDeleted(picked.map(p => p.item.id));   // 记删除标记，云同步时不会被拉回来

                undoBuffer = picked;          // 只保留最近一次批量删除
                selectedIds.clear();
                lastEditTime = new Date();
                updateLastSaved();
                refreshCategories();
                if (!categories.includes(currentCategory) && currentCategory !== '全部') currentCategory = '全部';
                renderAll();
                updateUndoBtn();
                saveData();
                alert(`🗑️ 已删除 ${picked.length} 条问答。\n\n如需恢复，点批量条上的「撤销删除」。`);
            }

            /** 撤销上一次批量删除：按原下标把条目插回原位 */
            function undoBatchDelete() {
                if (undoBuffer.length === 0) { alert('没有可撤销的批量删除'); return; }
                const back = undoBuffer.slice().sort((a, b) => a.index - b.index);
                back.forEach(p => {
                    const at = Math.min(Math.max(p.index, 0), qaData.length);
                    qaData.splice(at, 0, p.item);
                });
                unmarkDeleted(back.map(p => p.item.id));   // 撤销 = 撤销删除标记
                undoBuffer = [];
                lastEditTime = new Date();
                updateLastSaved();
                refreshCategories();
                renderAll();
                updateUndoBtn();
                saveData();
                alert(`↩️ 已恢复 ${back.length} 条问答。`);
            }

            /** 数据被整体替换 / 清空时，撤销缓冲失效 */
            function clearUndoBuffer() {
                undoBuffer = [];
                updateUndoBtn();
            }

            function renderQaList() {
                clearImageUI();
                const filtered = getFilteredData();
                if (filtered.length === 0) {
                    container.innerHTML =
                        `<div class="empty-message">${ICON.inbox}${searchKeyword.trim() ? '没有匹配的问答' : '当前分类没有问答，点击 "新增问答" 创建'}</div>`;
                    renderPagination(0, 1);
                    updateBatchBar();
                    return;
                }

                // —— 分页：先夹取页码，再切片 ——
                const total = filtered.length;
                const totalPages = Math.max(1, Math.ceil(total / pageSize));
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;
                const start = (currentPage - 1) * pageSize;
                const pageItems = filtered.slice(start, start + pageSize);

                const fragment = document.createDocumentFragment();
                const kw = searchKeyword.trim();
                pageItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'qa-item';
                    div.dataset.id = item.id;

                    const header = document.createElement('div');
                    header.className = 'qa-header';
                    const qDiv = document.createElement('div');
                    qDiv.className = 'qa-question';
                    const qHtml = kw ? highlightText(escapeHtml(item.question), kw) : escapeHtml(item.question);
                    qDiv.innerHTML = `<span class="q-icon">${ICON.question}</span> ${qHtml}`;

                    // —— 批量选择：卡片头部最左侧的复选框 ——
                    if (selectMode) {
                        if (selectedIds.has(item.id)) div.classList.add('qa-selected');
                        const cbWrap = document.createElement('label');
                        cbWrap.className = 'qa-select';
                        cbWrap.title = '选择这条问答';
                        const cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.checked = selectedIds.has(item.id);
                        cb.addEventListener('change', function() {
                            if (this.checked) selectedIds.add(item.id);
                            else selectedIds.delete(item.id);
                            div.classList.toggle('qa-selected', this.checked);
                            updateBatchBar();
                        });
                        cbWrap.appendChild(cb);
                        header.appendChild(cbWrap);
                    }

                    const meta = document.createElement('div');
                    meta.className = 'qa-meta';
                    meta.innerHTML = `<span class="time">${ICON.calendar} ${item.time || '--'}</span>
                          <span class="qa-actions">
                            <button class="edit-q-btn" title="编辑问题标题（也可双击标题）">${ICON.penTitle}<span>改问题</span></button>
                            <button class="edit-btn" title="编辑回答内容">${ICON.pen}<span>编辑回答</span></button>
                            <button class="del-btn" title="删除这条问答">${ICON.trash}<span>删除</span></button>
                          </span>`;
                    header.appendChild(qDiv);
                    header.appendChild(meta);

                    const ansDiv = document.createElement('div');
                    ansDiv.className = 'qa-answer';
                    const answerContent = document.createElement('div');
                    answerContent.className = 'answer-content';
                    const answerHtml = item.answer || '';
                    // 高亮只作用于文本节点，不会破坏 img 的 src（base64）
                    const displayHtml = kw ? highlightHtml(answerHtml, kw) : answerHtml;
                    // 含自由定位图片时才切成定位容器，普通回答排版保持原样
                    if (displayHtml.indexOf('qa-img-free') > -1) answerContent.classList.add('free-layer');
                    answerContent.innerHTML = displayHtml || '<span class="empty-answer">（空回答）</span>';
                    ansDiv.innerHTML = `<span class="answer-label">${ICON.comment} 回答</span> `;
                    ansDiv.appendChild(answerContent);

                    const footer = document.createElement('div');
                    footer.className = 'qa-footer';
                    const badgeGroup = document.createElement('div');
                    badgeGroup.className = 'badge-group';

                    const types = [
                        { key: 'important', label: '重要', icon: ICON.exclaim },
                        { key: 'normal', label: '一般', icon: ICON.dot },
                        { key: 'favorite', label: '收藏', icon: ICON.star },
                    ];
                    types.forEach(type => {
                        const span = document.createElement('span');
                        span.className = `badge-icon ${type.key}${item.importance === type.key ? ' active' : ''}`;
                        span.innerHTML = `${type.icon}${type.label}`;
                        span.addEventListener('click', function(e) {
                            e.stopPropagation();
                            item.importance = (item.importance === type.key) ? 'normal' : type.key;
                            lastEditTime = new Date();
                            updateLastSaved();
                            renderQaList();
                            renderTabs();
                            renderImportanceTabs();
                            saveData();
                        });
                        badgeGroup.appendChild(span);
                    });

                    const catSelect = document.createElement('select');
                    catSelect.className = 'qa-category-select';
                    const allCats = categories.filter(c => c !== '全部');
                    allCats.forEach(cat => {
                        const opt = document.createElement('option');
                        opt.value = cat;
                        opt.textContent = cat;
                        if (cat === item.category) opt.selected = true;
                        catSelect.appendChild(opt);
                    });
